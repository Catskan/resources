---
# Socle de l'hôte Proxmox « Optiplex » (Dell OptiPlex 7090 Micro) — nœud de
# runtime de la maison (Immich, vinted-bot, pokemon-monitor, claude-code), le NAS
# Synology restant le stockage de masse.
#
# Dépôts APT sains, hygiène de l'hôte (fstrim des CT, alerte disque, journald,
# plafond ARC ZFS, contournement du bug réseau e1000e), le CT claude-code, puis
# durcissement SSH.
#
# Le CT claude-code (VMID 201) est arrivé ici le 2026-08-23, migré du Wyse — voir
# Catskan/nas-claude-code, MIGRATION-OPTIPLEX.md. Sa création vit dans le play du
# socle (rôle proxmox_claude_lxc, tag `lxc`) et son provisioning dans un second
# play qui se connecte au CT lui-même.
#
# sshd_hardening est VOLONTAIREMENT en dernier : si le durcissement se révélait
# verrouillant, les briques utiles du socle sont déjà appliquées.
#
# Le rattachement au tailnet vit dans main_headscale_playbook.yml : il a besoin
# de la preauthkey produite par le play headscale.
#
# make optiplex                            → socle + CT claude-code
# make check-optiplex                      → dry-run (--check --diff)
# make optiplex ARGS='--skip-tags sshd'    → tout sauf le durcissement SSH
# make optiplex ARGS='--tags zfs'          → plafond ARC seul
# make optiplex ARGS='--tags nic'          → offloads + watchdog de lien seuls
# make optiplex ARGS='--tags sshd'         → durcissement SSH seul
# make optiplex ARGS='--tags lxc'          → création/démarrage du CT 201 seuls
# make claude-code                         → provisioning du CT seul (Docker, etc.)
#
# ⚠️ Le durcissement SSH se lance en gardant une session SSH de secours ouverte,
#    et en validant une NOUVELLE connexion avant de la fermer.

- name: Socle de l'hôte Proxmox Optiplex
  hosts: proxmox_optiplex
  gather_facts: true
  roles:
    - role: proxmox_repos
      tags: [repos]
    - role: proxmox_host_maintenance
      tags: [maintenance]
    # Le CT claude-code, avant le durcissement SSH pour la même raison que
    # celle-ci est en dernier : si le durcissement verrouillait, le CT est déjà là.
    - role: proxmox_claude_lxc
      tags: [lxc]
    - role: sshd_hardening
      tags: [sshd]

# Second play : on parle au CT, pas à l'hôte. Il joint le CT par son adresse
# tailnet (host_vars/claude-code/connection.yml), donc il ne dépend pas de l'accès
# SSH à l'hôte et n'est pas affecté par sshd_hardening ci-dessus.
- name: Provisionner le CT claude-code (Docker + prérequis)
  hosts: claude_code_hosts
  gather_facts: true
  tags: [claude_code]

  roles:
    - role: claude_code_host
    - role: cloudcli_service
