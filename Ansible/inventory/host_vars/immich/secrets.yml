---
# Mot de passe sudo de `aurel` sur la VM Immich. Aucune valeur en clair : le lookup
# lit KeePass, dont l'emplacement et la passphrase arrivent par KEEPASS_LOCATION et
# KEEPASS_PSW, que scripts/run.sh demande une fois au lancement.
ansible_become_password: "{{ lookup('viczem.keepass.keepass', 'Proxmox Aurélien/Debian Immich', 'password') }}"
