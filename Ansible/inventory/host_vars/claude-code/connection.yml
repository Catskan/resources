# LXC claude-code : VMID 201 sur l'Optiplex depuis la migration du 2026-08-23.
# (Avant : VMID 101 sur le Wyse, atteint en ProxyJump à travers la Freebox de la
# mère. Voir Catskan/nas-claude-code, MIGRATION-OPTIPLEX.md.)
#
# On l'atteint par son adresse TAILNET, sans ProxyJump. Trois raisons :
#   - le contrôleur est un portable : une IP LAN ne vaut que tant qu'il est à la
#     maison, l'adresse tailnet vaut partout ;
#   - c'est déjà l'adresse que tout le reste de l'outillage utilise (run-on,
#     claude-nas, CLAUDE_CONFIG_TARGET de claude-sync.sh) — une seule vérité ;
#   - plus de saut : l'Optiplex est sur le même LAN que le contrôleur, la raison
#     d'être du ProxyJump a disparu avec le déménagement.
#
# ⚠️ NE PAS remettre 192.168.1.96 : cette IP désigne le CONTRÔLEUR lui-même sur
#    le LAN d'Aurélien. Les deux sites numérotent en 192.168.1.0/24 avec la même
#    passerelle .254, donc l'ancienne valeur « semble » encore plausible. Elle
#    pointerait le Mac. C'est précisément le piège relevé pendant la migration.
#
# Alternative si le tailnet est indisponible : ansible_host 192.168.1.101, qui
# atteint le même CT — mais seulement depuis le LAN d'Aurélien.
#
# ⚠️ ansible_port 22 EXPLICITE : le CT écoute en 22, mais le contrôleur (Air)
#    remappe ssh->2122 dans /etc/services → sans ça Ansible viserait 2122.
#
# Vérifié le 2026-08-24 : `ssh -p 22 root@100.64.0.1` donne hostname claude-code,
# /srv/claude présent et PID 1 = /sbin/init — donc bien le CT, pas le conteneur
# Docker qui tourne dedans. C'est le CT qu'on provisionne.
ansible_connection: ssh
ansible_host: 100.64.0.1
ansible_port: 22
ansible_user: root
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
