---
# Staging validé : certificats émis, challenge HTTP-01 fonctionnel sur les deux noms. On
# passe en production.
#
# NON FAIT — reste dû avant toute bascule du port 443 : un vrai login DSM dans un
# navigateur, pas un simple code 200 (ce prérequis avait été levé par erreur dans le
# brief de la tâche 4 ; ce commentaire le corrige, il ne l'avait jamais été en réalité).
# Vérification objective de l'état de la bascule : l'émetteur du certificat servi sur le
# 443 public — Sectigo = l'ancien proxy du NAS répond encore (bascule pas faite) ;
# Let's Encrypt = la bascule a eu lieu.
caddy_acme_staging: false

# Vhosts servis par le CT.
#
# DSM reste sur le NAS : ce vhost traverse donc le LAN vers 192.168.1.7, là où
# l'ancien proxy visait son propre loopback. `upstream_tls: true` suffit : le template
# émet `header_up Host` automatiquement dès qu'il est vrai (il n'existe pas de clé
# `header_up_host` séparée) — voir son commentaire, qui documente le 403 Web Station
# et le « Your login is invalid » que l'absence de ce header provoque.
caddy_vhosts:
  - name: photos.eonelia.fr
    backend: 192.168.1.112:2283
  - name: nas.eonelia.fr
    backend: 192.168.1.7:443
    upstream_tls: true
    # Le certificat que DSM présente EN INTERNE sur 192.168.1.7:443 est encore
    # l'ancien wildcard Sectigo (*.eonelia.fr, expire le 25 août 2026) : le
    # renouvellement récent a mis à jour le certificat que le proxy présente au
    # public, pas celui que DSM sert dans son propre magasin — ce sont deux
    # magasins distincts. Sans upstream_insecure, Caddy vérifierait ce
    # certificat via tls_server_name et le 26 août ce vhost tomberait en 502.
    #
    # On abandonne cette vérification amont uniquement parce que le saut se
    # fait entièrement sur le LAN, du CT (192.168.1.210) au NAS (192.168.1.7) —
    # deux machines de la maison, jamais sur Internet. Ça retire toute
    # dépendance de DSM à un certificat wildcard commercial et fait disparaître
    # l'échéance du 26 août.
    #
    # IMPORTANT — ce que ça NE change PAS : la connexion publique reste
    # entièrement chiffrée et vérifiée. Le client externe parle à Caddy en TLS
    # avec le certificat Let's Encrypt normal de nas.eonelia.fr ; seul le
    # tronçon interne Caddy→DSM, sur le LAN, échappe à la vérification du
    # certificat amont.
    upstream_insecure: true

  # WebUI du vinted-bot, hébergée sur le NAS (conteneur `vinted-bot-webui`, en
  # `network_mode: host` → port 8089 de 192.168.1.7). Vhost PRIVÉ : l'interface
  # écrit des `user_action` ensuite poussés sur Vinted, et sa route
  # `/cookies/import` remplace les cookies de session d'un compte à partir d'un
  # fichier HAR déposé. Derrière une simple authentification Basic, elle n'a rien
  # à faire sur Internet — d'où `allow_networks`, qui laisse Caddy écouter pour
  # tous (le challenge HTTP-01 en a besoin) mais ne répond qu'aux origines
  # déclarées, 404 sinon.
  #
  # Deux réseaux autorisés, pour couvrir les deux chemins d'accès :
  #   - 192.168.1.0/24 : depuis la maison, chemin direct vers le CT.
  #   - 100.64.0.0/10  : depuis le tailnet.
  #
  # ⚠️ Le second ne fonctionnera QUE lorsque le CT aura rejoint le tailnet — ce que
  # prévoit le design du 2026-08-17 (« CT Caddy dédié sur l'Optiplex, rôle
  # proxmox_caddy_lxc, rattaché au tailnet ») mais qui n'est PAS fait à ce jour :
  # vérifié le 2026-08-19, `tailscale` est absent du CT 102 comme de l'hôte
  # Proxmox. En attendant, seul l'accès LAN répondra ; le filtre tailnet est posé
  # d'avance pour qu'aucune modification ne soit nécessaire le jour du
  # rattachement. Le rôle `tailscale_client` existe déjà dans ce dépôt.
  #
  # DNS : `vinted.eonelia.fr` a besoin d'un A public vers la Freebox pour que le
  # challenge HTTP-01 aboutisse, exactement comme photos et nas. Le split-horizon
  # dnsmasq du même design le fera ensuite résoudre vers 192.168.1.210 depuis la
  # maison, évitant l'aller-retour par le NAT.
  - name: vinted.eonelia.fr
    backend: 192.168.1.7:8089
    allow_networks:
      - 192.168.1.0/24
      - 100.64.0.0/10

# --- Rattachement au tailnet (non activé) -------------------------------------
# Mettre à true pour que `make caddy` monte /dev/net/tun dans le CT et y applique
# le rôle tailscale_client. Tant que ce drapeau est faux, le vhost privé
# vinted.eonelia.fr ne répond que depuis le LAN : son filtre 100.64.0.0/10 est
# posé d'avance mais aucune requête n'en vient, le CT n'étant pas sur le tailnet.
#
# ⚠️ L'activer entraîne un REDÉMARRAGE DU CT — une modification de configuration
# LXC n'est prise en compte qu'au démarrage. Tous les vhosts tombent le temps du
# reboot : photos.eonelia.fr (Immich, app mobile comprise) et nas.eonelia.fr (DSM
# en externe), une quinzaine de secondes. À planifier, pas à subir au détour d'un
# déploiement de routine.
#
# Prérequis : une preauthkey Headscale valide. Le rôle la lit dans
# hostvars['headscale'].hs_preauthkey, produite par `make headscale`. En run isolé :
#   make caddy ARGS='--tags tailscale -e tailscale_authkey=<clé>'
caddy_ct_tailscale: true

# Nom du nœud sur le tailnet. Le défaut du rôle est `inventory_hostname`, soit
# « caddy » — trop générique dans une liste de nœuds où figurent déjà le NAS et
# deux Mac. Ce nom dit la machine ET son rôle.
tailscale_hostname: "caddy-optiplex"

# --accept-dns=false (défaut du rôle) est conservé : le CT résout par 192.168.1.254
# et le split-horizon DNS du design du 2026-08-17 s'appuie dessus. Laisser Tailscale
# imposer son résolveur ferait diverger la résolution vue par Caddy de celle vue par
# le reste de la maison.
