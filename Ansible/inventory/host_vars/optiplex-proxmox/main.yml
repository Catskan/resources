---
# Plafond ARC de ZFS. 8 GiB max / 2 GiB min sur 32 Go de RAM. Valeur propre à
# CETTE machine — le rôle proxmox_host_maintenance n'a volontairement pas de
# défaut, pour éviter qu'un autre hôte ZFS hérite d'un plafond calibré ailleurs.
#
# Historique, parce que le sens du réglage s'est INVERSÉ : en août 2026 la machine
# avait 16 Go et était sur-engagée (déficit de 640 Mo absorbé par le swap). Le
# plafond était alors à 4 GiB, et le baisser était le levier le plus rentable.
# Depuis le passage à 32 Go, l'engagement maximum retombe à ~25 Go et c'est
# l'inverse qui est vrai : un ARC à 4 GiB bride inutilement le cache d'un hôte qui
# sert Immich sur ZFS. D'où 8 GiB.
pve_zfs_arc_max_bytes: 8589934592
pve_zfs_arc_min_bytes: 2147483648

# VMID de la VM Immich, consommé par roles/immich_vm/tasks/onboot.yml pour lui poser
# `onboot: 1`. Sans défaut côté rôle, délibérément : un `qm set` sur le mauvais
# identifiant reconfigurerait une autre machine.
immich_vm_vmid: 101

# Durcissement SSH (rôle sshd_hardening).
# root par clé uniquement : c'est le modèle de connexion ci-dessus. Le défaut du
# rôle (PermitRootLogin "no") verrouillerait l'hôte, et l'assert anti-lockout du
# rôle ne contrôle que AllowUsers — il ne l'aurait pas vu.
# AllowUsers est le point d'extension prévu si un compte de service apparaît.
sshd_allowed_users:
  - root
sshd_permit_root_login: "prohibit-password"

# ⚠️ NE PAS définir sshd_port ici : la tâche qui le consomme est gardée sur macOS.
#    Le port 2125 reste réglé à la main dans /etc/ssh/sshd_config sur l'hôte.

# --- Carte réseau : bug e1000e « Detected Hardware Unit Hang » -----------------
# Le 2026-08-17, cet hôte est devenu totalement injoignable pendant 30 minutes —
# lui ET ses deux VM — sans que rien ne redémarre : 447 occurrences de
# « Detected Hardware Unit Hang » du driver e1000e sur son Intel i219, la file de
# transmission figée alors que le lien restait DÉCLARÉ up (carrier 0, errors 0).
# Résolu en débranchant/rebranchant le câble, soit un reset du lien.
#
# « nic0 » est le nommage stable d'interface de PVE 9 (altname enxc025a599d934) —
# pas un nom inventé, et il ne ressemble volontairement pas aux enpXsY habituels.
#
# Valeurs propres à CETTE machine : le Wyse n'a ni ce contrôleur ni ce problème,
# d'où les defaults vides côté rôle.
pve_nic_offload_iface: nic0
pve_nic_watchdog_iface: nic0

# Cible du watchdog laissée vide → la passerelle (192.168.1.254) est détectée à
# l'exécution. La coder en dur ici ferait échouer le watchdog après un changement
# de plan d'adressage, exactement quand on a besoin de lui.
pve_nic_watchdog_target: ""

# --- Sauvegarde vzdump --------------------------------------------------------
# Cet hôte avait déjà un job créé dans l'UI le 2026-08-19, jamais exécuté (créé
# un mercredi, planifié le dimanche) et sans aucune rétention. Il est repris ici
# pour qu'il vive en git et qu'il élague.
pve_backup_storage: NAS_Backup_NFS

# 01:00 conservé de l'existant. Le Wyse dumpe à 03:00 : les deux visent le MÊME
# volume2 du NAS (exports « Proxmox Aurelien » et « Proxmox maman »), le décalage
# évite qu'ils se disputent l'export.
pve_backup_schedule: "sun 01:00"

# Pas de bwlimit : le NAS est sur le LAN. Mesuré le 2026-08-22 sur un dump réel
# depuis cet hôte : 95 Mio/s. C'est le Wyse, dont le dump traverse le WAN, qui a
# besoin d'un plafond.

# Rétention, dimensionnée sur un job complet RÉELLEMENT exécuté le 2026-08-23 à
# 00:07 (8 min 36 s au total) et non sur une estimation :
#   VM 100 HomeAssistant   2,96 Go   (52 s)
#   VM 101 Immich         38,40 Go   (6 min 20 s)  ← le poste dominant
#   CT 102 caddy           0,39 Go   (14 s)
#   CT 200 pokemon         3,04 Go   (1 min 10 s)
#   -------------------------------
#   total                 44,80 Go par dump complet
#
# Avec une sauvegarde par semaine, cette règle garde ~6 archives (les 4 semaines
# de keep-weekly couvrent keep-last, keep-monthly ajoute 2 mois antérieurs), soit
# ~270 Go. Le Wyse ajoute ~90 Go sur le MÊME volume2, qui a 1,1 To libres.
#
# ⚠️ Ne pas ré-estimer ce volume à partir d'un ratio de compression de CT. Une
#    première estimation à ~21 Go s'est révélée fausse d'un facteur 2 : les CT
#    compressent à 2,4-3,4:1, mais le disque de la VM Immich contient surtout des
#    vignettes, du cache de modèles ML et Postgres — des données DÉJÀ compressées,
#    qui sortent à ~1,1:1.
#
# ⚠️ La bibliothèque Immich N'EST PAS dans le disque de la VM : elle vit côté NAS
#    sur /volume2/Photos/Immich (mesuré le 2026-08-23 : library 749 Go,
#    encoded-video 292 Go). Le dump de la VM 101 ne grossira donc pas avec les
#    photos — mais le corollaire est que CE JOB NE SAUVEGARDE AUCUNE PHOTO. La
#    protection des photos ne dépend que du NAS.
pve_backup_prune: "keep-last=2,keep-weekly=4,keep-monthly=3"

# Le CT 201 claude-code est SORTI du job `--all`, et sauvegardé par un job dédié.
#
# Motif, mesuré le 2026-08-24 : son dump échoue par intermittence quand il est
# pris dans la série du job global — deux échecs sur trois passages, sur
# « got unexpected control message: » juste après le freeze/thaw, et le job
# s'arrête là (RC 255). En ciblé il n'a jamais échoué : 4 essais sur 4 réussis,
# 201 seul, 102→201, 100→201 et même 101→201 avec les 160 GiB d'Immich juste
# devant. Ni « un CT avant », ni « une VM avant », ni la pression mémoire
# (13,5 Go disponibles tout du long) n'expliquent donc l'échec — la cause reste
# INCONNUE. Le faisceau pointe le canal de contrôle LXC de ce CT, seul du parc à
# faire tourner Docker imbriqué avec onze montages bind : même organe que le
# « container did not stop » observé sur son extinction.
#
# Ce n'est donc pas un correctif, c'est un contournement — mais il évite l'effet
# le plus grave : un échec sur le 201 INTERROMPAIT le job, laissant le CT 202
# vinted-bot sans sauvegarde (constaté le 2026-08-24 au matin).
#
# ⚠️ Le job dédié (schedule sun 02:00, `all 0` + `vmid 201`) N'EST PAS géré par
#    ce rôle, et c'est VOULU : tasks/vzdump.yml refuse d'agir si plusieurs jobs
#    portent le marqueur `pve_backup_marker`. Le job dédié en est donc dépourvu,
#    le rôle l'ignore, et une convergence ne le recréera pas s'il disparaît. À
#    reprendre si le rôle apprend un jour à gérer plusieurs jobs.
#    Détails : Catskan/nas-claude-code, MIGRATION-OPTIPLEX.md §9.6
pve_backup_exclude: "201"

# --- Attente du NFS avant les invités ------------------------------------------
# Constaté le 2026-08-24, après un redémarrage de l'hôte : les CT 103
# ai-agent-astreinte et 202 vinted-bot NE SE SONT PAS rallumés, et il a fallu les
# démarrer à la main. Le log de tâche est net :
#
#   run_buffer: 569 Script exited with status 2
#   lxc_init: 1037 Failed to run lxc.hook.pre-start for container "103"
#   TASK ERROR: startup for container '103' failed
#
# `lxc.hook.pre-start` est ce qui monte les points de montage du conteneur. Or ces
# deux CT sont les SEULS à avoir des `mp` hors de leur rootfs, et tous pointent
# /mnt/pve/NAS_Aurelien :
#   103:mp0 → …/AI/Claude-data
#   202:mp0 → …/Projects/vinted-bot/data-aurelien
#   202:mp1 → …/Projects/vinted-bot/data-amandine
# `startall` s'est lancé 7 secondes après le boot, avant que pvestatd n'ait monté
# l'export. Les cinq autres invités, qui ne dépendent que de local-zfs, ont
# démarré sans problème — d'où le caractère sélectif de la panne.
#
# ⚠️ Différence avec le Wyse, pour qui ce mécanisme a été écrit : ici le montage
#    n'est PAS dans /etc/fstab, c'est un stockage PVE monté par pvestatd. La tâche
#    de patch fstab ne trouvera donc rien à modifier (sans effet), et la boucle du
#    script tentera un `systemctl start mnt-pve-NAS_Aurelien.mount` qui n'existe
#    pas — échec avalé par son `|| true`. Le script se réduit alors à une pure
#    attente de `findmnt`, ce qui est précisément le besoin.
#
# L'unité générée est `Before=pve-guests.service` sans `Requires` : elle ORDONNE
# sans opposer de veto. Si le NAS reste absent, elle rend la main au bout de
# tries × delay et les invités démarrent quand même — 103 et 202 échoueront alors
# comme aujourd'hui, mais sans bloquer les autres.
pve_nfs_wait_mounts:
  - /mnt/pve/NAS_Aurelien
