---
# Secrets du NAS Synology — tous résolus depuis KeePass (aucune valeur en clair).

# Mot de passe sudo du compte administrateur DSM utilisé par Ansible.
# NB : l'entrée « Nas » est déjà référencée par playbooks/test_keepass.yml.
ansible_become_password: "{{ lookup('viczem.keepass.keepass', 'Nas', 'password') }}"

# --- Wildcard *.eonelia.fr ----------------------------------------------------
# Mêmes attachments que le CT headscale (entrée « Certificate *.eonelia.fr »,
# groupe racine). viczem.keepass écrit chaque attachment dans un fichier temp sur
# le contrôleur et retourne son CHEMIN → utilisé comme `src` de copy dans le rôle
# (préserve le binaire ; la normalisation PEM/DER est faite côté NAS).
immich_kp_cert_entry: "Certificate *.eonelia.fr"
immich_att_leaf: "{{ lookup('viczem.keepass.keepass', immich_kp_cert_entry, 'attachments', 'eonelia.fr_ssl_certificate.cer') }}"
immich_att_int1: "{{ lookup('viczem.keepass.keepass', immich_kp_cert_entry, 'attachments', 'intermediate1.cer') }}"
immich_att_int2: "{{ lookup('viczem.keepass.keepass', immich_kp_cert_entry, 'attachments', 'intermediate2.cer') }}"
immich_att_key: "{{ lookup('viczem.keepass.keepass', immich_kp_cert_entry, 'attachments', '*.eonelia.fr_private_key.key') }}"
