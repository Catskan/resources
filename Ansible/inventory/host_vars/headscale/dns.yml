---
# Horizon « tailnet » du split-horizon DNS
# (cf. docs/2026-08-17-caddy-universel-split-dns-design.md, §1).
#
# Les noms servis par le reverse-proxy ont tous un enregistrement A PUBLIC, imposé
# par le challenge ACME HTTP-01 : Let's Encrypt doit joindre le CT sur le port 80.
# Ce n'est pas une fuite — les certificats sont de toute façon publiés dans les
# journaux Certificate Transparency. Ce qui protège un service privé, c'est le
# matcher `remote_ip` du vhost, pas l'obscurité de son nom.
#
# Sans les enregistrements ci-dessous, un nœud du tailnet résout l'IP publique et
# ressort donc par la Freebox pour y revenir — chemin plus lent, et surtout source
# vue par Caddy qui n'est plus une adresse du tailnet, ce qui ferait échouer le
# filtre `allow_networks` des vhosts privés.
#
# Le CT Caddy a rejoint le tailnet le 2026-08-21 : l'IP attendue ici existe
# désormais. Relevée par `pct exec 102 -- tailscale ip -4` sur l'Optiplex, et
# confirmée par le rôle tailscale_client (« caddy tailnet IP : 100.64.0.10 »).
# Elle est stable tant que le nœud n'est pas supprimé côté headscale ; la revoir
# après un `tailscale logout` suivi d'un nouveau rattachement.
#
# Ne concerne QUE les vhosts privés : photos.eonelia.fr et nas.eonelia.fr sont
# publics et doivent continuer à résoudre l'IP publique partout. vinted.eonelia.fr
# est aujourd'hui le seul vhost privé de caddy_vhosts — en ajouter un implique
# d'ajouter ici l'enregistrement correspondant, sinon son filtre `allow_networks`
# rejettera les nœuds du tailnet, qui ressortiraient par l'IP publique.
headscale_dns_extra_records:
  - name: "vinted.eonelia.fr"
    type: "A"
    value: "100.64.0.10"
