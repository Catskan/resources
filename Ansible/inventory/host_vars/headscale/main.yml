---
# Bascule ACME (Let's Encrypt) pour cet hôte uniquement — le défaut du rôle
# (roles/headscale/defaults/main.yml) reste "certfile", volontairement (control
# plane du tailnet : pas de dépendance à une réécriture de code sous pression
# pour recouvrer TLS, cf. commentaire du rôle). Ce fichier est l'override
# explicite, posé une fois les prérequis réseau validés (redirection WAN:443,
# DNS, réservation DHCP).
headscale_tls_mode: "acme"
headscale_acme_email: "a.busutil@icloud.com"

# PRODUCTION Let's Encrypt, décidée le 2026-08-18 après validation complète en
# staging (émission confirmée, certificat "(STAGING)" réellement servi, tailnet
# testé). Le défaut du rôle reste le staging (acme-staging-v02) — surchargé ICI
# UNIQUEMENT, jamais dans defaults/main.yml, pour que quiconque expérimente le
# mode acme sur un autre hôte reparte du staging par défaut et ne tape pas la
# production par accident.
# ⚠️ Avant cette bascule, purger /var/lib/headscale/cache sur le CT (déplacer,
# pas supprimer) : headscale y garde le certificat déjà obtenu (ici, celui du
# staging) et ne redemandera rien à la prod si l'ancien cache reste en place —
# changer cette URL seule n'a aucun effet visible sans cette purge.
headscale_acme_url: "https://acme-v02.api.letsencrypt.org/directory"
