---
# VM Debian qui héberge Immich sur l'hôte Proxmox « Optiplex ».
#
# Ce playbook ne déploie PAS Immich : le stack docker-compose et l'unité systemd
# vivent dans le dépôt `immich-custom`, cloné sur la VM dans /home/aurel. Il pose les
# réglages système qu'un `docker compose up -d` ne peut pas garantir, tous découverts
# lors de l'incident du 17 août 2026 :
#
#   - `ifupdown-wait-online` activé, pour que network-online.target veuille dire
#     quelque chose — sans lui le montage NFS part 4 s après le boot et échoue ;
#   - options `nofail,retry=5` sur le montage des originaux ;
#   - `immich.service` installé, qui refuse de lancer les conteneurs sans le
#     montage — Immich sur un /data vide croirait les 149 Go d'originaux disparus ;
#   - `aurel` dans adm/systemd-journal, sans quoi journalctl reste muet ;
#   - `onboot: 1` côté hôte, sinon la VM ne remonte pas au retour du courant ;
#   - l'agent invité QEMU, pour un arrêt propre piloté par Proxmox, et le
#     presse-papiers de la console noVNC (`clipboard=vnc`).
#
# Le second play cible l'HÔTE Proxmox et non la VM : `qm` n'existe que là. Il attend
# `immich_vm_vmid` dans host_vars de l'hôte — pas de défaut, un `qm set` sur le
# mauvais identifiant toucherait une autre machine.
#
# Le rôle est autonome : l'unité systemd est rendue depuis son propre template, avec
# les chemins tirés des variables. Rien à préparer sur la VM avant de lancer.
#
# Ne pas confondre avec `main_immich_playbook.yml`, qui déploie le reverse-proxy TLS
# devant Immich : celui-ci configure la machine qui l'héberge.
#
# ⚠️ Le PREMIER passage doit être réel, pas un --check : deux tâches dépendent de
#    fichiers que le dry-run n'écrit pas — l'unité systemd, qu'on ne peut activer
#    avant qu'elle existe, et data/config.yaml, dont le répertoire parent est créé
#    juste avant. Les deux sont gardées par `not ansible_check_mode` ; une fois le
#    run réel passé, le --check redevient complet.
#
# make immich-vm                        → réglages VM + service + démarrage auto
# make check-immich-vm                  → dry-run (--check --diff)
# make immich-vm ARGS='--tags service'  → régénère seulement data/config.yaml
# make immich-vm ARGS='--tags system'   → seulement les réglages système

- name: Réglages système de la VM Immich
  hosts: immich_hosts
  gather_facts: true
  roles:
    - role: immich_vm
      tags: [system]
    # Configuration du service de ce dépôt : data/config.yaml, avec les clés lues
    # dans KeePass. Après immich_vm, dont l'unité systemd lance le conteneur.
    - role: immich_service
      tags: [service]

- name: Réglages de la VM Immich côté hôte Proxmox
  hosts: proxmox_optiplex
  gather_facts: false
  tasks:
    - name: Poser onboot, l'agent invité et le presse-papiers
      ansible.builtin.include_role:
        name: immich_vm
        tasks_from: host.yml
