---
# Création idempotente du CT Caddy via pct/pveam (sans token API), sur l'hôte Proxmox.
# Même logique que proxmox_headscale_lxc : CT créé, démarré, JOIGNABLE EN SSH (clé du
# contrôleur injectée + sshd) → devient ensuite un hôte Ansible dédié (rôle caddy_proxy).
# pct exec n'est utilisé QUE pour le bootstrap SSH.
#
# Différence assumée avec le CT headscale : IP STATIQUE et non dhcp. La porte d'entrée
# publique de la maison ne peut pas changer d'adresse au gré d'un bail, et la redirection
# de ports de la Freebox pointe une IP fixe.

# L'existence du CT se vérifie AVANT tout ce qui touche au template : une fois le
# conteneur créé, son image ne sert plus à rien. Or Proxmox ne garde au catalogue
# qu'UNE version courante par template, et l'épinglage à une version précise devient
# faux dès que Debian publie un point release — `pveam download` répond alors
# « no such template » et fait échouer un rôle qui, sans cette tâche, n'aurait eu
# aucun changement à appliquer.
#
# Constaté le 2026-08-20 sur proxmox_headscale_lxc, épinglé à
# debian-13-standard_13.1-2 disparu du catalogue : un `make headscale` de routine
# s'arrêtait au premier play alors que le CT headscale tournait depuis des semaines.
# Ce rôle-ci avait le même défaut, masqué par le fait que sa version épinglée était
# encore la version courante.
- name: "Vérifier l'existence du CT {{ caddy_ct_vmid }}"
  ansible.builtin.command: "pct status {{ caddy_ct_vmid }}"
  register: caddy_pct_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Lister les templates LXC présents
  ansible.builtin.command: "pveam list {{ caddy_ct_template_storage }}"
  register: caddy_pveam_list
  changed_when: false
  check_mode: false
  when: caddy_pct_status.rc != 0

# `| default('')` est nécessaire : quand le CT existe, la tâche précédente est sautée
# et `caddy_pveam_list.stdout` n'est pas défini.
- name: Rafraîchir le catalogue des templates si le nôtre est absent
  ansible.builtin.command: pveam update
  when:
    - caddy_pct_status.rc != 0
    - caddy_ct_template not in (caddy_pveam_list.stdout | default(''))
  changed_when: true

- name: Télécharger le template Debian si absent
  ansible.builtin.command: "pveam download {{ caddy_ct_template_storage }} {{ caddy_ct_template }}"
  when:
    - caddy_pct_status.rc != 0
    - caddy_ct_template not in (caddy_pveam_list.stdout | default(''))
  changed_when: true

- name: Déposer la clé publique du contrôleur sur l'hôte Proxmox
  ansible.builtin.copy:
    content: "{{ lookup('file', caddy_ct_controller_pubkey_path) }}\n"
    dest: /root/caddy-controller.pub
    owner: root
    group: root
    mode: "0600"
  when: caddy_pct_status.rc != 0

- name: "Créer le CT {{ caddy_ct_vmid }} (caddy)"
  ansible.builtin.command: >-
    pct create {{ caddy_ct_vmid }}
    {{ caddy_ct_template_storage }}:vztmpl/{{ caddy_ct_template }}
    --hostname {{ caddy_ct_hostname }}
    --unprivileged {{ caddy_ct_unprivileged }}
    {% if caddy_ct_features %}--features {{ caddy_ct_features }}{% endif %}
    --cores {{ caddy_ct_cores }}
    --memory {{ caddy_ct_memory }}
    --swap {{ caddy_ct_swap }}
    --rootfs {{ caddy_ct_rootfs }}
    --net0 name=eth0,bridge={{ caddy_ct_bridge }},ip={{ caddy_ct_ip }}/{{ caddy_ct_cidr }},gw={{ caddy_ct_gateway }}
    --nameserver {{ caddy_ct_nameserver }}
    --onboot {{ caddy_ct_onboot }}
    --ssh-public-keys /root/caddy-controller.pub
  when: caddy_pct_status.rc != 0
  changed_when: true

- name: "Démarrer le CT {{ caddy_ct_vmid }}"
  ansible.builtin.command: "pct start {{ caddy_ct_vmid }}"
  when: "'status: running' not in (caddy_pct_status.stdout | default(''))"
  changed_when: true

- name: Bootstrap SSH dans le CT (openssh-server + activation)
  ansible.builtin.command: >-
    pct exec {{ caddy_ct_vmid }} -- bash -lc
    'apt-get update && apt-get install -y openssh-server && systemctl enable --now ssh'
  register: caddy_ct_sshd
  changed_when: "'Setting up openssh-server' in caddy_ct_sshd.stdout"

# Sautée en --check : la création du CT elle-même (tâche « Créer le CT ») est sautée
# en dry-run (le module command n'est pas check-mode aware), donc le CT n'existe pas
# encore quand cette vérification tournerait → « Configuration file ... does not
# exist » cassant le dry-run à chaque fois, même quand le rôle serait sans effet.
- name: Vérifier que le CT porte bien l'IP statique attendue
  ansible.builtin.command: "pct exec {{ caddy_ct_vmid }} -- ip -4 -o addr show eth0"
  register: caddy_ct_addr
  changed_when: false
  failed_when: caddy_ct_ip not in caddy_ct_addr.stdout
  when: not ansible_check_mode

# --- Prérequis Tailscale ------------------------------------------------------
# Monté depuis l'hôte : un CT non privilégié n'a pas /dev/net/tun, et le rôle
# tailscale_client échoue explicitement sans lui.
#
# `unsafe_writes` est nécessaire : /etc/pve est pmxcfs, un système de fichiers FUSE
# répliqué où l'écriture atomique par fichier temporaire puis rename() n'est pas
# garantie. Sans ce réglage, la tâche peut échouer sur « Could not replace file ».
# ⚠️ PAS de `blockinfile` ici, et c'est le point à ne pas re-découvrir. PVE
# ré-sérialise `/etc/pve/lxc/<id>.conf` à chaque écriture : il remonte les
# commentaires en tête du fichier et repousse les lignes `lxc.*` brutes à la fin,
# donc HORS des marqueurs. Au run suivant, blockinfile retrouve ses marqueurs —
# devenus vides et orphelins en tête — et réécrit le bloc, que PVE déplace à
# nouveau. Résultat : une paire de lignes ajoutée à CHAQUE exécution.
#
# Constaté le 2026-08-23 : le CT 101 `claude-code` portait les deux lignes
# répétées 10 fois (20 lignes de doublons sur 33, plus un bloc de marqueurs vide
# en tête) et le CT 102 `caddy` en avait déjà 2 paires. Fonctionnellement inoffensif
# — LXC ignore les redites — mais le fichier grossit sans fin et le rôle mentait
# en rapportant `changed` à chaque passage.
#
# `lineinfile` avec une regexp ancrée sur la ligne exacte la retrouve où que PVE
# l'ait déplacée, donc reste idempotent malgré la ré-sérialisation.
#
# `unsafe_writes` reste nécessaire : /etc/pve est pmxcfs, un FUSE répliqué où
# l'écriture atomique par fichier temporaire puis rename() n'est pas garantie.
- name: "Monter /dev/net/tun (prérequis Tailscale) dans le CT {{ caddy_ct_vmid }}"
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ caddy_ct_vmid }}.conf"
    line: "{{ item }}"
    regexp: "^{{ item | regex_escape }}$"
    state: present
    unsafe_writes: true
  loop:
    - "lxc.cgroup2.devices.allow: c 10:200 rwm"
    - "lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file"
  when:
    - caddy_ct_tailscale | bool
    - not ansible_check_mode or caddy_pct_status.rc == 0
  notify: Redémarrer le CT Caddy

# Nettoyage des dégâts de l'ancienne implémentation. Pas de `notify` : retirer des
# redites ne change rien à ce que voit LXC, donc ça ne justifie pas de redémarrer
# le conteneur — contrairement à l'ajout d'une ligne manquante ci-dessus.
- name: "Retirer les marqueurs blockinfile hérités du CT {{ caddy_ct_vmid }}"
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ caddy_ct_vmid }}.conf"
    regexp: "^# (BEGIN|END) ANSIBLE tailscale( tun| — roles/proxmox_caddy_lxc)?$"
    state: absent
    unsafe_writes: true
  when: not ansible_check_mode or caddy_pct_status.rc == 0

# awk garde la PREMIÈRE occurrence de chacune des deux lignes gérées et jette les
# suivantes. Le fichier temporaire vit hors de /etc/pve — pmxcfs ne supporte pas
# le motif « écrire à côté puis renommer » — et la réécriture se fait en place.
- name: "Dédupliquer les lignes lxc.* du CT {{ caddy_ct_vmid }}"
  ansible.builtin.shell: |
    set -eu
    f=/etc/pve/lxc/{{ caddy_ct_vmid }}.conf
    t=$(mktemp /tmp/lxcconf.XXXXXX)
    before=$(md5sum "$f" | cut -d" " -f1)
    awk '!(/^lxc\.(cgroup2\.devices\.allow: c 10:200 rwm|mount\.entry: \/dev\/net\/tun )/ && seen[$0]++)' "$f" > "$t"
    cat "$t" > "$f"
    rm -f "$t"
    if [ "$before" = "$(md5sum "$f" | cut -d" " -f1)" ]; then echo "changed=0"; else echo "changed=1"; fi
  register: caddy_ct_dedup
  changed_when: "'changed=1' in caddy_ct_dedup.stdout"
  when: not ansible_check_mode or caddy_pct_status.rc == 0
