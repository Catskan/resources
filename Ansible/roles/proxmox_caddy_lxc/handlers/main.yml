---
# Redémarrage du CT après un changement de sa configuration LXC.
#
# Une modification de /etc/pve/lxc/<vmid>.conf n'est appliquée qu'au démarrage du
# conteneur : sans ce redémarrage, /dev/net/tun resterait absent et le rôle
# tailscale_client échouerait au play suivant.
#
# `pct reboot` procède à un arrêt propre puis relance. Tous les vhosts servis par
# Caddy sont indisponibles pendant l'opération.
- name: Redémarrer le CT Caddy
  ansible.builtin.command: "pct reboot {{ caddy_ct_vmid }}"
  changed_when: true

# Le second play attaque le CT en SSH immédiatement après : sans cette attente, il
# se heurterait à un « Connection refused » sur un conteneur encore en train de
# démarrer. On teste le port SSH plutôt qu'un délai fixe.
- name: Attendre que le CT réponde en SSH
  ansible.builtin.wait_for:
    host: "{{ caddy_ct_ip }}"
    port: 22
    delay: 3
    timeout: 120
