---
# Plafond ARC de ZFS, avec DOUBLE GARDE :
#   1. le module zfs doit être chargé (le Wyse est sur LVM-thin → tout est sauté)
#   2. une valeur doit être définie pour cet hôte (les defaults du rôle sont vides)
#
# Contresens fréquent à éviter : depuis PVE 8.1 l'installeur pose déjà une limite
# à 10 % de la RAM. Le problème qu'on corrige ici est qu'elle est trop BASSE, pas
# trop haute. Le vieux défaut « 50 % de la RAM » ne vaut que pour les installs
# antérieures ou les pools ajoutés après coup.
#
# Tag : zfs

- name: "[zfs] Détecter le module ZFS"
  ansible.builtin.stat:
    path: /sys/module/zfs
  register: proxmox_host_maintenance_zfs_module

- name: "[zfs] Détecter proxmox-boot-tool (ESP synchronisées)"
  ansible.builtin.stat:
    path: /etc/kernel/proxmox-boot-uuids
  register: proxmox_host_maintenance_boot_uuids

- name: "[zfs] Réglage du plafond ARC"
  when:
    - proxmox_host_maintenance_zfs_module.stat.exists
    - pve_zfs_arc_max_bytes | string | length > 0
    - pve_zfs_arc_min_bytes | string | length > 0
  block:
    # Ce rôle est la SOURCE UNIQUE du plafond ARC. Un zfs_arc_* défini dans un
    # autre fichier de modprobe.d écraserait silencieusement le nôtre au boot
    # (modprobe concatène tous les fichiers) : Ansible afficherait `changed` en
    # mentant sur le résultat effectif. Vécu sur l'Optiplex, où le réglage à la
    # main était éclaté entre zfs.conf (max) et 99-zfs.conf (min).
    # On ne touche QUE les fichiers sans paquet propriétaire, et on ne supprime
    # un fichier que s'il ne reste rien d'autre dedans.
    - name: "[zfs] Éliminer les définitions zfs_arc_* concurrentes dans modprobe.d"
      ansible.builtin.shell: |
        set -eu
        changed=0
        for f in /etc/modprobe.d/*.conf; do
          [ -f "$f" ] || continue
          [ "$f" = /etc/modprobe.d/99-zfs.conf ] && continue
          grep -q 'zfs_arc_' "$f" || continue
          if dpkg -S "$f" >/dev/null 2>&1; then
            echo "$f définit zfs_arc_* et appartient à un paquet Debian." >&2
            echo "Ansible ne le modifie pas : arbitre à la main, puis relance." >&2
            exit 1
          fi
          sed -i '/zfs_arc_/d' "$f"
          # Ne reste que du vide ou des commentaires → on retire le fichier.
          # (pas d apostrophe dans ce bloc : Ansible decoupe les arguments du
          #  module shell AVANT le shell, et la compterait comme un quote ouvert)
          if ! grep -qE '^[[:space:]]*[^#[:space:]]' "$f"; then
            rm -f "$f"
          fi
          changed=1
        done
        echo "changed=$changed"
      register: proxmox_host_maintenance_arc_cleanup
      changed_when: "'changed=1' in proxmox_host_maintenance_arc_cleanup.stdout"
      failed_when: proxmox_host_maintenance_arc_cleanup.rc != 0
      notify:
        - Régénérer l'initramfs
        - Rafraîchir proxmox-boot-tool

    - name: "[zfs] Déposer /etc/modprobe.d/99-zfs.conf (persistant, appliqué au boot)"
      ansible.builtin.copy:
        dest: /etc/modprobe.d/99-zfs.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Géré par Ansible — rôle proxmox_host_maintenance. Ne pas éditer à la main.
          options zfs zfs_arc_max={{ pve_zfs_arc_max_bytes }}
          options zfs zfs_arc_min={{ pve_zfs_arc_min_bytes }}
      notify:
        - Régénérer l'initramfs
        - Rafraîchir proxmox-boot-tool

    # Le plafond est monté AVANT le plancher : ZFS refuse un arc_min supérieur à
    # l'arc_max courant, et on part typiquement d'un plafond bas posé par l'installeur.
    - name: "[zfs] Appliquer les bornes à chaud (évite d'attendre un reboot)"
      ansible.builtin.shell: |
        set -eu
        changed=0
        cur_max=$(cat /sys/module/zfs/parameters/zfs_arc_max)
        cur_min=$(cat /sys/module/zfs/parameters/zfs_arc_min)
        if [ "$cur_max" != "{{ pve_zfs_arc_max_bytes }}" ]; then
          echo {{ pve_zfs_arc_max_bytes }} > /sys/module/zfs/parameters/zfs_arc_max
          changed=1
        fi
        if [ "$cur_min" != "{{ pve_zfs_arc_min_bytes }}" ]; then
          echo {{ pve_zfs_arc_min_bytes }} > /sys/module/zfs/parameters/zfs_arc_min
          changed=1
        fi
        echo "changed=$changed"
      register: proxmox_host_maintenance_arc_live
      changed_when: "'changed=1' in proxmox_host_maintenance_arc_live.stdout"
