---
# Job de sauvegarde vzdump de l'hôte, avec DOUBLE GARDE — même logique que
# zfs_arc.yml : un stockage cible doit être défini pour cet hôte (les defaults du
# rôle sont vides → tout ce fichier est sauté), et ce stockage doit être déclaré
# dans la configuration du cluster.
#
# POURQUOI ce rôle plutôt que l'UI. Constaté le 2026-08-22 : le Wyse (site
# distant, chez la mère) n'avait AUCUN job planifié — `/etc/pve/jobs.cfg` vide —
# alors que son stockage NFS pointait déjà vers le NAS de l'autre site. Les seuls
# dumps présents dataient du 27 juillet, soit près d'un mois. La plomberie de la
# sauvegarde croisée existait dans les deux sens et n'était utilisée dans aucun,
# précisément sur la machine qu'on ne peut pas aller réparer à la main. Un job
# créé dans l'UI ne laisse aucune trace en git : d'où sa place ici.
#
# IDENTITÉ DU JOB — le piège de ce fichier. PVE génère un UUID à la création et
# n'accepte pas d'identifiant imposé : impossible de viser le job par un nom
# stable, donc impossible d'utiliser une garde du genre `creates:`. On marque les
# nôtres avec `pve_backup_marker` dans le champ `comment` et on les retrouve par
# ce marqueur. Conséquence à connaître : réécrire ou supprimer ce commentaire
# dans l'UI rend le job invisible au rôle, qui en recréera un second à côté.
#
# Tag : backup

- name: "[backup] Lire le stockage cible dans la configuration du cluster"
  ansible.builtin.command:
    argv:
      [pvesh, get, "/storage/{{ pve_backup_storage }}", --output-format, json]
  register: proxmox_host_maintenance_backup_storage
  changed_when: false
  failed_when: false

# Échec volontairement bruyant : un job qui pointe un stockage inexistant
# n'échoue qu'à 03:00 le dimanche, dans un log que personne ne lit.
- name: "[backup] Exiger que le stockage cible existe"
  ansible.builtin.assert:
    that: proxmox_host_maintenance_backup_storage.rc == 0
    fail_msg: >-
      Le stockage « {{ pve_backup_storage }} » n'est pas déclaré sur
      {{ inventory_hostname }}. Déclare-le d'abord (Datacenter > Storage), ou
      laisse pve_backup_storage vide pour cet hôte.
    quiet: true

- name: "[backup] Lister les jobs de sauvegarde du nœud"
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/backup, --output-format, json]
  register: proxmox_host_maintenance_backup_jobs
  changed_when: false

- name: "[backup] Isoler les jobs portant notre marqueur"
  ansible.builtin.set_fact:
    proxmox_host_maintenance_backup_managed: >-
      {{
        (proxmox_host_maintenance_backup_jobs.stdout | from_json)
        | selectattr('comment', 'defined')
        | selectattr('comment', 'search', pve_backup_marker | regex_escape)
        | list
      }}

# Deux jobs marqués = quelqu'un a dupliqué, ou le marqueur d'un job a été
# réécrit puis restauré. On ne devine pas lequel garder.
- name: "[backup] Refuser d'agir si plusieurs jobs portent le marqueur"
  ansible.builtin.assert:
    that: proxmox_host_maintenance_backup_managed | length <= 1
    fail_msg: >-
      {{ proxmox_host_maintenance_backup_managed | length }} jobs portent le
      marqueur « {{ pve_backup_marker }} » sur {{ inventory_hostname }}
      (ids : {{ proxmox_host_maintenance_backup_managed | map(attribute='id') | join(', ') }}).
      Supprime les surnuméraires dans l'UI, puis relance.
    quiet: true

# Options communes à la création et à la mise à jour, pour qu'elles ne puissent
# pas diverger entre les deux chemins. `bwlimit` n'est passé que s'il est défini :
# l'omettre et le passer à 0 ne sont pas équivalents côté PVE.
- name: "[backup] Composer les options du job"
  ansible.builtin.set_fact:
    proxmox_host_maintenance_backup_opts: >-
      {{
        ['--all', pve_backup_all | string,
         '--storage', pve_backup_storage,
         '--schedule', pve_backup_schedule,
         '--mode', pve_backup_mode,
         '--compress', pve_backup_compress,
         '--enabled', pve_backup_enabled | string,
         '--notes-template', pve_backup_notes_template,
         '--notification-mode', pve_backup_notification_mode,
         '--prune-backups', pve_backup_prune]
        + (['--bwlimit', pve_backup_bwlimit | string]
           if (pve_backup_bwlimit | string | length > 0) else [])
      }}

- name: "[backup] Créer le job de sauvegarde"
  when: proxmox_host_maintenance_backup_managed | length == 0
  ansible.builtin.command:
    argv: >-
      {{
        ['pvesh', 'create', '/cluster/backup']
        + proxmox_host_maintenance_backup_opts
        + ['--comment', pve_backup_comment]
      }}
  changed_when: true

- name: "[backup] Faire converger un job existant"
  when: proxmox_host_maintenance_backup_managed | length == 1
  vars:
    job: "{{ proxmox_host_maintenance_backup_managed | first }}"
    # `prune-backups` revient de l'API en DICTIONNAIRE de chaînes
    # (« {"keep-last":"2",…} »), alors qu'on le déclare en chaîne façon CLI. On
    # normalise les deux côtés en « clé=valeur » triés : comparer les formes
    # brutes échouerait, PVE réordonnant les clés — le job paraîtrait dériver à
    # chaque exécution et serait réécrit pour rien.
    wanted:
      schedule: "{{ pve_backup_schedule }}"
      storage: "{{ pve_backup_storage }}"
      mode: "{{ pve_backup_mode }}"
      compress: "{{ pve_backup_compress }}"
      all: "{{ pve_backup_all | string }}"
      enabled: "{{ pve_backup_enabled | string }}"
      bwlimit: "{{ pve_backup_bwlimit | string }}"
      notes-template: "{{ pve_backup_notes_template }}"
      notification-mode: "{{ pve_backup_notification_mode }}"
      prune: "{{ pve_backup_prune | split(',') | map('trim') | sort | join(',') }}"
    current:
      schedule: "{{ job.schedule | default('') }}"
      storage: "{{ job.storage | default('') }}"
      mode: "{{ job.mode | default('') }}"
      compress: "{{ job.compress | default('') }}"
      all: "{{ job.all | default('') | string }}"
      enabled: "{{ job.enabled | default('') | string }}"
      bwlimit: "{{ job.bwlimit | default('') | string }}"
      notes-template: "{{ job['notes-template'] | default('') }}"
      notification-mode: "{{ job['notification-mode'] | default('') }}"
      prune: >-
        {{ job['prune-backups'] | default({}) | dict2items
           | map(attribute='key') | zip(job['prune-backups'] | default({})
           | dict2items | map(attribute='value') | map('string'))
           | map('join', '=') | sort | join(',') }}
  block:
    - name: "[backup] Réaligner le job sur la configuration déclarée"
      when: wanted != current
      ansible.builtin.command:
        argv: >-
          {{
            ['pvesh', 'set', '/cluster/backup/' ~ job.id]
            + proxmox_host_maintenance_backup_opts
            + ['--comment', pve_backup_comment]
          }}
      changed_when: true
