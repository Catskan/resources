---
# Deux mesures contre le figement de la carte réseau — bug e1000e « Detected
# Hardware Unit Hang » sur contrôleur Intel i219, constaté le 2026-08-17 sur
# srv-run-proxmox (30 min d'indisponibilité de l'hôte et de ses VM) :
#
#   1. désactiver les offloads TSO/GSO au démarrage — le remède le plus documenté
#      pour ce bug précis, et celui qui supprime la cause plutôt que le symptôme ;
#   2. un watchdog qui réinitialise le lien quand la passerelle devient injoignable
#      alors que le lien est toujours déclaré up — la parade pour le cas où (1) ne
#      suffit pas, puisque ce mode de panne rend la machine inatteignable par tout
#      moyen, tailnet compris (la carte ne transmet plus rien).
#
# DOUBLE GARDE, sur le modèle de zfs_arc.yml : sans `pve_nic_offload_iface` ni
# `pve_nic_watchdog_iface` définis pour l'hôte, tout ce fichier est sauté. Le nom
# d'interface est propre à la machine (« nic0 » est le nommage stable de PVE 9) et
# un réglage calibré pour l'Optiplex ne doit pas fuir vers le Wyse, qui n'a ni le
# même contrôleur ni le même problème.
#
# Choix d'implémentation à ne pas « simplifier » par erreur :
#   - un service systemd plutôt qu'un `post-up` dans /etc/network/interfaces : une
#     erreur dans ce fichier coûte un déplacement physique, précisément ce que tout
#     ce chantier cherche à éviter ;
#   - un timer plutôt que cron : la granularité descend sous l'heure, systemd
#     empêche le recouvrement de deux exécutions, et tout part dans journald.
#
# Tag : nic

# --- 1. Offloads désactivés au boot -------------------------------------------
- name: "[maint] ethtool présent (requis par les réglages d'offload)"
  ansible.builtin.package:
    name: ethtool
    state: present
  when: pve_nic_offload_iface | length > 0

- name: "[maint] Service de désactivation des offloads sur {{ pve_nic_offload_iface }}"
  ansible.builtin.copy:
    dest: /etc/systemd/system/nic-offload.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Géré par Ansible — rôle proxmox_host_maintenance.
      # Contourne le bug e1000e « Detected Hardware Unit Hang » : les offloads de
      # segmentation sont le déclencheur identifié dans la majorité des rapports.
      [Unit]
      Description=Désactive les offloads {{ pve_nic_offload_flags }} sur {{ pve_nic_offload_iface }} (bug e1000e)
      After=networking.service
      Wants=networking.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/ethtool -K {{ pve_nic_offload_iface }} {{ pve_nic_offload_flags }}

      [Install]
      WantedBy=multi-user.target
  when: pve_nic_offload_iface | length > 0
  notify: Appliquer les offloads NIC

# ⚠️ GARDE ansible_check_mode OBLIGATOIRE sur les tâches systemd qui suivent.
# En --check, le fichier d'unité n'est pas réellement écrit : systemd ne connaît
# donc pas le service et le module échoue sur « Could not find the requested
# service », faisant échouer tout le dry-run alors que le play réel fonctionne.
# Le repo s'appuie sur `make check-optiplex` pour vérifier avant d'appliquer :
# ces tâches doivent être sautées en dry-run, pas le contraire.
- name: "[maint] Activer nic-offload.service"
  ansible.builtin.systemd_service:
    name: nic-offload.service
    enabled: true
    daemon_reload: true
  when:
    - pve_nic_offload_iface | length > 0
    - not ansible_check_mode

# --- 2. Watchdog de lien ------------------------------------------------------
- name: "[maint] Script du watchdog de lien"
  ansible.builtin.copy:
    src: nic-link-watchdog
    dest: /usr/local/sbin/nic-link-watchdog
    owner: root
    group: root
    mode: "0755"
  when: pve_nic_watchdog_iface | length > 0

- name: "[maint] Service du watchdog de lien ({{ pve_nic_watchdog_iface }})"
  ansible.builtin.copy:
    dest: /etc/systemd/system/nic-link-watchdog.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Géré par Ansible — rôle proxmox_host_maintenance.
      [Unit]
      Description=Watchdog du lien {{ pve_nic_watchdog_iface }} (reset après figement e1000e)

      [Service]
      Type=oneshot
      Environment=WATCHDOG_IFACE={{ pve_nic_watchdog_iface }}
      Environment=WATCHDOG_TARGET={{ pve_nic_watchdog_target }}
      Environment=WATCHDOG_FAIL_THRESHOLD={{ pve_nic_watchdog_fail_threshold }}
      Environment=WATCHDOG_COOLDOWN={{ pve_nic_watchdog_cooldown }}
      ExecStart=/usr/local/sbin/nic-link-watchdog
  when: pve_nic_watchdog_iface | length > 0

# Le template doit terminer le nom (règle ansible-lint name[template]) : pas de
# caractère après la variable, d'où la formulation « période en secondes : … ».
- name: "[maint] Timer du watchdog de lien, période en secondes : {{ pve_nic_watchdog_interval }}"
  ansible.builtin.copy:
    dest: /etc/systemd/system/nic-link-watchdog.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      # Géré par Ansible — rôle proxmox_host_maintenance.
      # OnBootSec laisse le réseau s'établir avant le premier contrôle, sinon le
      # watchdog conclurait à une panne pendant le démarrage de l'hôte.
      [Unit]
      Description=Déclenche le watchdog du lien {{ pve_nic_watchdog_iface }}

      [Timer]
      OnBootSec=120
      OnUnitActiveSec={{ pve_nic_watchdog_interval }}
      AccuracySec=5s

      [Install]
      WantedBy=timers.target
  when: pve_nic_watchdog_iface | length > 0

# Même garde qu'au-dessus : en --check l'unité n'existe pas encore sur l'hôte.
- name: "[maint] Activer et démarrer le timer du watchdog"
  ansible.builtin.systemd_service:
    name: nic-link-watchdog.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - pve_nic_watchdog_iface | length > 0
    - not ansible_check_mode
