---
# Fiabilise les montages NFS de l'hôte dont dépendent des invités, avec la GARDE
# habituelle du rôle : `pve_nfs_wait_mounts` est vide par défaut, donc tout ce
# fichier est sauté sur un hôte qui n'en a pas.
#
# LE DÉFAUT CORRIGÉ, constaté sur le Wyse le 2026-08-22. `/etc/fstab` déclarait
# `100.64.0.6:/volume1/Aurelien /mnt/nas-aurelien nfs vers=4,_netdev,nofail,soft` —
# mais côté hôte le point de montage faisait 4 Ko et n'apparaissait pas dans
# `/proc/mounts` : le montage avait échoué au démarrage et `nofail` avait tu l'échec.
# Cause : `_netdev` n'attend pas `tailscaled`, alors que l'export est joint par une
# adresse du tailnet (`100.64.0.6`).
#
# Ce qui rend le diagnostic trompeur : le CT 103, dont le `mp0` référence ce chemin,
# LISAIT parfaitement ses fichiers — parce qu'il conservait le montage dans son propre
# namespace, hérité d'un démarrage où le NFS répondait. Démonter côté hôte ne détache
# que la vue de l'hôte. L'hôte disait « rien monté », le conteneur disait « tout va
# bien », et les deux avaient raison. Au prochain redémarrage du conteneur, son `mp0`
# serait devenu un dossier vide — silencieusement, sans erreur.
#
# Deux corrections complémentaires :
#   1. la ligne fstab reçoit x-systemd.requires/after=tailscaled.service, pour que
#      l'unité générée soit ordonnée après le tailnet ;
#   2. une unité d'attente RÉESSAIE le montage et s'ordonne avant pve-guests, parce
#      qu'une unité `.mount` issue du fstab n'a pas de `Restart=` — si elle échoue une
#      fois, plus personne ne la relance.
#
# Tag : nfs

- name: "[nfs] Script d'attente de montage"
  ansible.builtin.copy:
    src: nfs-mount-wait
    dest: /usr/local/sbin/nfs-mount-wait
    owner: root
    group: root
    mode: "0755"

# Idempotent et non destructif : on n'ajoute les options que si elles manquent, sans
# réécrire la ligne. `backrefs` garde la ligne existante telle quelle quand le motif
# ne matche pas, donc un fstab déjà corrigé n'est pas touché.
- name: "[nfs] Ordonner le montage fstab après tailscaled"
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\S+\s+{{ item | regex_escape }}\s+nfs\s+(?![^\s]*x-systemd\.requires)\S+)(\s+\d+\s+\d+)$'
    replace: '\1,x-systemd.requires=tailscaled.service,x-systemd.after=tailscaled.service\2'
    backup: true
  loop: "{{ pve_nfs_wait_mounts }}"
  register: proxmox_host_maintenance_nfs_fstab

- name: "[nfs] Unité d'attente, ordonnée avant les invités Proxmox"
  ansible.builtin.template:
    src: nfs-mount-wait.service.j2
    dest: "/etc/systemd/system/nfs-mount-wait-{{ item | regex_replace('^/', '') | regex_replace('/', '-') }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ pve_nfs_wait_mounts }}"

- name: "[nfs] Activer l'unité d'attente"
  ansible.builtin.systemd_service:
    name: "nfs-mount-wait-{{ item | regex_replace('^/', '') | regex_replace('/', '-') }}.service"
    enabled: true
    daemon_reload: true
    state: started
  loop: "{{ pve_nfs_wait_mounts }}"

# Contrôle explicite : c'est /proc/mounts DE L'HÔTE qui tranche, jamais un `ls` depuis
# un conteneur — voir l'en-tête. Sans cette vérification, le rôle passerait au vert sur
# un hôte où rien n'est monté.
- name: "[nfs] Vérifier que chaque montage est effectivement monté"
  ansible.builtin.command:
    argv: [findmnt, -M, "{{ item }}"]
  loop: "{{ pve_nfs_wait_mounts }}"
  register: proxmox_host_maintenance_nfs_check
  changed_when: false
  # Lecture seule : s'exécute aussi en --check, sinon la vérification est muette
  # exactement dans le mode où on vient chercher une confirmation.
  check_mode: false
  failed_when: proxmox_host_maintenance_nfs_check.rc != 0
