---
# Hygiène disque d'un hôte Proxmox — partagée par tous les hyperviseurs. Évite le
# retour de la saturation qui a mis pve-root à 100 % le 2026-07-13 (build cache
# Docker dans le CT + blocs .raw jamais rendus à l'hôte).
#   - pct fstrim hebdo : rend à l'hôte l'espace libéré dans les CT
#   - journald plafonné : borne les journaux systemd de l'hôte
#   - alerte disque : prévient (journald) avant saturation
#   - plafond ARC ZFS (zfs_arc.yml) : conditionné à la présence du module
#   - carte réseau (nic_watchdog.yml) : contournement du bug e1000e, conditionné
#     à une interface définie pour l'hôte
#   - sauvegarde (vzdump.yml) : job hebdomadaire vers un stockage offsite,
#     conditionné à une cible définie pour l'hôte
# Tags : maintenance, zfs, nic, backup

- name: "[maint] fstrim hebdomadaire de tous les CT (rend l'espace à pve-root)"
  ansible.builtin.copy:
    src: pct-fstrim
    dest: /etc/cron.weekly/pct-fstrim
    owner: root
    group: root
    mode: "0755"

- name: "[maint] Alerte disque horaire (seuil 85 %)"
  ansible.builtin.copy:
    src: disk-alert
    dest: /etc/cron.hourly/disk-alert
    owner: root
    group: root
    mode: "0755"

- name: "[maint] Répertoire drop-in journald"
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "[maint] Plafonner les journaux systemd de l'hôte ({{ pve_journal_max_use }})"
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-maxuse.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Géré par Ansible — rôle proxmox_host_maintenance.
      [Journal]
      SystemMaxUse={{ pve_journal_max_use }}
  notify: Redémarrer systemd-journald

- name: Plafond ARC de ZFS (conditionné à la présence du module)
  ansible.builtin.import_tasks: zfs_arc.yml
  tags: zfs

- name: Contournement du bug e1000e (conditionné à une interface définie)
  ansible.builtin.import_tasks: nic_watchdog.yml
  tags: nic

- name: Job de sauvegarde vzdump (conditionné à un stockage cible défini)
  ansible.builtin.import_tasks: vzdump.yml
  when: pve_backup_storage | string | length > 0
  tags: backup
