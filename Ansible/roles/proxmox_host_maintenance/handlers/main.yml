---
- name: Redémarrer systemd-journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

# ⚠️ ORDRE SIGNIFICATIF : Ansible exécute les handlers dans leur ordre de
# DÉFINITION, pas dans l'ordre des notify. L'initramfs doit être régénéré avant
# que proxmox-boot-tool ne recopie les noyaux vers les ESP.
- name: Régénérer l'initramfs
  ansible.builtin.command: update-initramfs -u -k all
  changed_when: true

- name: Rafraîchir proxmox-boot-tool
  ansible.builtin.command: proxmox-boot-tool refresh
  changed_when: true
  when: proxmox_host_maintenance_boot_uuids.stat.exists

# Volontairement en dernier : aucun lien avec la séquence initramfs → boot-tool
# ci-dessus, et l'y insérer changerait l'ordre d'exécution de celle-ci.
# Applique les offloads sans attendre un redémarrage de l'hôte.
# La garde ansible_check_mode est indispensable ici aussi : en dry-run la tâche
# qui notifie est « changed », donc ce handler s'exécuterait sur un service que
# systemd ne connaît pas encore, et ferait échouer le dry-run.
- name: Appliquer les offloads NIC
  ansible.builtin.systemd_service:
    name: nic-offload.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode
