---
# Plafond des journaux systemd de l'hôte.
pve_journal_max_use: 200M

# Plafond ARC de ZFS — VOLONTAIREMENT VIDE. À définir par hôte dans
# inventory/host_vars/<host>/main.yml : le bon plafond dépend de la RAM de la
# machine. Sans valeur, tout le bloc de tasks/zfs_arc.yml est sauté.
pve_zfs_arc_max_bytes: ""
pve_zfs_arc_min_bytes: ""

# --- Carte réseau : contournement du bug e1000e --------------------------------
# Interfaces VOLONTAIREMENT VIDES, même logique que l'ARC ci-dessus : le nom
# d'interface est propre à la machine et le problème ne concerne que l'Optiplex
# (Intel i219). Sans valeur, tout tasks/nic_watchdog.yml est sauté.

# Offloads désactivés au démarrage. TSO/GSO sont le déclencheur identifié du bug
# « Detected Hardware Unit Hang » dans la majorité des rapports.
pve_nic_offload_iface: ""
pve_nic_offload_flags: "tso off gso off"

# Watchdog de lien : réinitialise le lien si la cible devient injoignable alors que
# le lien est toujours déclaré up.
pve_nic_watchdog_iface: ""
# Cible du test. Vide = passerelle par défaut détectée à l'exécution, ce qui garde
# le test au niveau du voisinage L2 et insensible à une panne du FAI.
pve_nic_watchdog_target: ""
# Nombre d'échecs consécutifs avant reset. Court-circuité dès que la signature
# e1000e apparaît dans dmesg : dans ce cas attendre ne prolonge que la coupure.
pve_nic_watchdog_fail_threshold: 3
# Délai minimum entre deux resets, pour ne pas boucler si la cause est ailleurs.
pve_nic_watchdog_cooldown: 600
# Période du timer, en secondes.
pve_nic_watchdog_interval: 60

# --- Sauvegarde vzdump ---------------------------------------------------------
# Stockage cible VOLONTAIREMENT VIDE, même logique que l'ARC et la NIC ci-dessus :
# la cible dépend de la machine, et un hôte sans cible déclarée saute tout
# tasks/vzdump.yml. Le bon réglage est la sauvegarde CROISÉE — chaque site dumpe
# sur le NAS de l'autre — sans quoi les archives partagent le sort de la machine
# qu'elles sauvegardent.
pve_backup_storage: ""

# Dimanche tôt. À décaler par hôte quand plusieurs nœuds visent le même NAS :
# deux dumps simultanés se disputent le même export NFS.
pve_backup_schedule: "sun 03:00"

# `all` : tout invité présent, y compris ceux créés après coup — le contraire
# d'une liste d'ID, qui laisse silencieusement de côté les nouvelles VM.
pve_backup_all: 1

# Exceptions à `all`, en VMID séparés par des virgules. Vide par défaut : la règle
# reste « on sauvegarde tout », et chaque exclusion doit se justifier par hôte.
# Le besoin est né le 2026-08-23 : `all` prend aussi les invités ARRÊTÉS, donc un
# CT gardé éteint comme filet de repli continuait d'être dumpé chaque semaine —
# ici 20 GiB inertes à travers le WAN d'un autre site, 42 min pour rien.
pve_backup_exclude: ""
pve_backup_enabled: 1
pve_backup_mode: snapshot
pve_backup_compress: zstd

# Rétention. Sans `prune-backups`, PVE garde TOUT : le stockage du Wyse n'avait
# aucune règle et n'aurait prévenu qu'en saturant.
pve_backup_prune: "keep-last=2,keep-weekly=4,keep-monthly=3"

# Limite de débit en Kio/s. Vide = pas de limite. À poser quand le dump traverse
# un lien qui ne nous appartient pas — le lien montant d'un site distant est
# partagé avec ses occupants.
pve_backup_bwlimit: ""

# {% raw %} : ce gabarit est interprété par PVE, pas par Jinja. Sans l'échappement,
# Ansible chercherait une variable `guestname` et échouerait au templating.
pve_backup_notes_template: "{% raw %}{{guestname}}{% endraw %}"
pve_backup_notification_mode: notification-system

# Marqueur d'appartenance, cherché dans le champ `comment` — c'est la seule
# identité stable dont on dispose, PVE imposant un UUID généré. Voir l'en-tête de
# tasks/vzdump.yml : ne pas le retirer du commentaire à la main.
pve_backup_marker: "gere par Ansible - role proxmox_host_maintenance"
pve_backup_comment: "Sauvegarde hebdomadaire offsite - {{ pve_backup_marker }}"

# Répertoire temporaire de vzdump. Défaut NON vide, contrairement aux autres
# réglages du rôle : ce n'est pas un choix propre à une machine mais une
# CORRECTION — sur le stockage de sauvegarde par défaut, le staging casse la
# sauvegarde de tout CT non privilégié vers du NFS. Voir tasks/vzdump.yml.
pve_backup_tmpdir: /var/tmp/vzdump

# --- Montages NFS de l'hôte dont dépendent des invités -------------------------
# Liste VOLONTAIREMENT VIDE, même logique que l'ARC et la NIC : propre à la machine.
# Y mettre les points de montage référencés par un `mp0` d'invité, pour qu'ils soient
# montés avant que Proxmox ne démarre les invités. Voir tasks/nfs_wait.yml.
pve_nfs_wait_mounts: []
# 60 × 5 s = 5 min. Cinq minutes parce qu'un Synology qui redémarre après une coupure
# met plusieurs minutes à servir NFS — même raisonnement que le rôle immich_vm.
pve_nfs_wait_tries: 60
pve_nfs_wait_delay: 5
