---
# VM Debian qui héberge Immich sur l'hôte Proxmox « Optiplex ».
#
# Ce rôle ne déploie PAS Immich : le stack docker-compose vit dans le dépôt
# `immich-custom`, cloné sur la VM. Il ne pose que les réglages système qui
# manquaient et qu'un `docker compose up -d` ne peut pas garantir — l'ordre de
# démarrage entre le montage NFS des originaux et les conteneurs.

# Dépôt immich-custom sur la VM. Il fournit le docker-compose que l'unité systemd
# lance et la configuration système d'Immich montée sur /config/immich.yaml — l'unité
# elle-même vient du template de ce rôle, pas du dépôt.
immich_vm_repo_dir: /home/aurel/immich-custom

# URL en SSH, comme le clone existant : c'est la clé de la VM qui authentifie GitHub,
# le dépôt étant privé. La changer en HTTPS casserait l'authentification, le module
# git reconfigurant le remote sur cette valeur.
immich_vm_repo_url: git@github.com:Catskan/immich-custom.git
immich_vm_repo_version: main

# Montage NFS des originaux (UPLOAD_LOCATION du .env côté Immich).
immich_vm_nfs_source: "192.168.1.7:/volume2/Photos/Immich"
immich_vm_nfs_path: /mnt/nas/immich

# `nofail` pour ne pas bloquer un boot si le NAS est absent. Pas de `retry` : mesuré
# le 19 août, il ne sert à rien ici — mount.nfs échoue sur « Network is unreachable »
# dès que la route manque, et cette option ne couvre que les délais d'attente. C'est
# l'ExecStartPre d'immich.service qui réessaie, seul endroit où l'attente est possible.
immich_vm_nfs_options: "hard,noatime,nfsvers=4,_netdev,nofail"

# Répertoire qui doit être visible sous le point de montage pour prouver que le NFS
# est bien monté — sert de sentinelle à l'unité systemd comme à ce rôle.
immich_vm_nfs_sentinel: library

# Nom de l'unité systemd que le fstab génère pour ce point de montage : /mnt/nas/immich
# donne mnt-nas-immich.mount. Dérivé plutôt que codé, pour qu'un changement de chemin
# n'oublie pas l'unité — c'est elle que l'ExecStartPre de immich.service relance.
immich_vm_nfs_unit: >-
  {{ immich_vm_nfs_path | regex_replace('^/', '') | regex_replace('/', '-') }}.mount

# Compte de service de la VM. Les groupes lui donnent accès au journal : sans eux,
# `journalctl -u mnt-nas-immich.mount` répond « No entries » au lieu de l'erreur.
immich_vm_user: aurel
immich_vm_journal_groups:
  - adm
  - systemd-journal
