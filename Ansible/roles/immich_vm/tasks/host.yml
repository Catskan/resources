---
# Tâches à jouer sur l'HÔTE Proxmox, pas dans la VM : `qm` n'existe que là.
#
# Trois réglages de la VM 101 :
#   onboot           sans lui, rien de ce que pose ce rôle ne se déclenche au retour du
#                    courant — la VM reste éteinte et Immich avec elle, comme le 17 août
#   agent            laisse Proxmox arrêter la VM proprement plutôt qu'en ACPI aveugle
#   clipboard=vnc    active le presse-papiers de la console noVNC
#
# ⚠️ `agent` et `vga` ne prennent effet qu'au PROCHAIN DÉMARRAGE de la VM : ils touchent
#    au matériel émulé. Ce rôle ne redémarre volontairement rien — couper Immich est une
#    décision qui revient à l'exploitant, pas à un playbook.

- name: Exiger un VMID explicite
  # Volontairement sans défaut : un `qm set` sur le mauvais identifiant toucherait
  # une autre machine. La valeur vit dans host_vars de l'hôte Proxmox concerné.
  ansible.builtin.assert:
    that:
      - immich_vm_vmid is defined
      - immich_vm_vmid | int > 0
    fail_msg: >-
      immich_vm_vmid n'est pas défini pour {{ inventory_hostname }}.
      Le renseigner dans inventory/host_vars/{{ inventory_hostname }}/main.yml.

- name: Lire la configuration de la VM Immich
  ansible.builtin.command: "qm config {{ immich_vm_vmid }}"
  changed_when: false
  register: immich_vm_qm_config

- name: Activer le démarrage automatique de la VM Immich
  ansible.builtin.command: "qm set {{ immich_vm_vmid }} --onboot 1"
  when: "'onboot: 1' not in immich_vm_qm_config.stdout"
  changed_when: true

- name: Activer l'agent invité côté hôte
  # Crée le canal virtio-serial que le service qemu-guest-agent attend dans la VM.
  ansible.builtin.command: "qm set {{ immich_vm_vmid }} --agent enabled=1"
  when: "'agent: enabled=1' not in immich_vm_qm_config.stdout"
  changed_when: true

- name: Activer le presse-papiers de la console noVNC
  # Le presse-papiers vient d'ici, pas de l'agent invité. Sur une console texte il
  # permet de coller — noVNC injecte le texte en frappes clavier ; un échange
  # bidirectionnel demanderait un environnement graphique et spice-vdagent.
  ansible.builtin.command: "qm set {{ immich_vm_vmid }} --vga std,clipboard=vnc"
  when: "'clipboard=vnc' not in immich_vm_qm_config.stdout"
  changed_when: true
