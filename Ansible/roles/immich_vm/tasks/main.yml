---
# Réglages système de la VM Immich. Origine : incident du 17 août 2026.
#
# Le montage NFS des originaux a échoué 4 secondes après le boot (boot 20:29:08,
# échec 20:29:12) alors que le NAS était allumé et joignable. Le réseau de la VM est
# géré par `ifupdown` et `ifupdown-wait-online.service` était désactivé : sans lui
# `network-online.target` est atteinte immédiatement et ne garantit rien. Le `_netdev`
# du fstab s'appuyant sur cette cible, mount.nfs part avant que l'interface soit
# utilisable, échoue, et sans `retry` n'essaie jamais plus. `remote-fs.target` reste
# inactif, `immich_postgres` démarre (SSD local) et `immich_server` non.
#
# Le danger n'est pas l'absence de service mais son contraire : Immich démarrant sur
# un `/data` vide considérerait les 149 Go d'originaux disparus. D'où l'unité
# `immich.service`, qui refuse de lancer les conteneurs sans le montage.

- name: Rendre network-online.target significative
  # Cause racine. Le paquet fournit l'unité mais Debian ne l'active pas : la cible
  # est alors « active » sans que le réseau le soit, et tout ce qui en dépend part
  # trop tôt — le montage NFS en premier.
  ansible.builtin.systemd_service:
    name: ifupdown-wait-online.service
    enabled: true
  become: true

- name: Rendre le montage NFS des originaux résilient
  # La ligne existe déjà : on n'en corrige que les options. `regexp` cible le point
  # de montage, seul champ stable si la source change un jour.
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "^\\S+\\s+{{ immich_vm_nfs_path | regex_escape }}\\s"
    line: "{{ immich_vm_nfs_source }} {{ immich_vm_nfs_path }} nfs {{ immich_vm_nfs_options }} 0 0"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Recharger les unités systemd

- name: Donner accès au journal au compte de service
  # Sans ces groupes, tout diagnostic se fait à l'aveugle : journalctl masque les
  # messages des autres utilisateurs et du système.
  ansible.builtin.user:
    name: "{{ immich_vm_user }}"
    groups: "{{ immich_vm_journal_groups }}"
    append: true
  become: true

- name: Installer l'unité systemd d'Immich
  # Rendue depuis le contrôleur : le rôle est autonome, et les chemins de l'unité
  # découlent des variables ci-dessus au lieu d'être écrits en dur.
  ansible.builtin.template:
    src: immich.service.j2
    dest: /etc/systemd/system/immich.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Recharger les unités systemd

- name: Appliquer les rechargements avant de démarrer quoi que ce soit
  ansible.builtin.meta: flush_handlers

- name: Monter les originaux
  # Le nom de l'unité découle du chemin : /mnt/nas/immich -> mnt-nas-immich.mount
  ansible.builtin.systemd_service:
    name: "{{ immich_vm_nfs_path | regex_replace('^/', '') | regex_replace('/', '-') }}.mount"
    state: started
  become: true

- name: Vérifier que les originaux sont réellement visibles
  # Un point de montage vide est indiscernable d'un montage réussi pour systemd :
  # on contrôle la sentinelle avant de laisser Immich démarrer.
  ansible.builtin.stat:
    path: "{{ immich_vm_nfs_path }}/{{ immich_vm_nfs_sentinel }}"
  register: immich_vm_sentinel

- name: Refuser de démarrer Immich sans ses originaux
  ansible.builtin.assert:
    that: immich_vm_sentinel.stat.isdir | default(false)
    fail_msg: >-
      {{ immich_vm_nfs_path }} est monté mais {{ immich_vm_nfs_sentinel }}/ est
      introuvable. Immich démarrerait sur un /data vide — ne pas continuer.

- name: Installer l'agent invité QEMU
  # Permet à Proxmox d'arrêter la VM proprement au lieu d'un ACPI aveugle — ce qui
  # compte ici : Postgres a déjà subi plusieurs coupures brutales. Donne aussi l'IP
  # dans l'interface et des snapshots cohérents (fsfreeze).
  #
  # Il ne gère PAS le presse-papiers, contrairement à une idée répandue : celui de
  # noVNC vient de `clipboard=vnc` côté hôte, posé par tasks/host.yml.
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Activer l'agent invité QEMU
  # Le service ne démarre que si le canal virtio-serial existe côté hôte. Tant que la
  # VM n'a pas redémarré après `qm set --agent enabled=1`, il échoue — d'où
  # `failed_when: false` plutôt qu'un run rouge sur une machine par ailleurs saine.
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: started
  become: true
  failed_when: false

- name: Mettre le dépôt applicatif à jour sur la VM
  # Le dépôt porte le docker-compose que l'unité lance et la configuration système
  # d'Immich. Un clone en retard, et la machine ne ressemble pas à ce que décrit ce
  # playbook : c'est ainsi que le service immich-custom est resté absent du compose
  # pendant une journée sans que rien ne le signale.
  #
  # Sans `become` : le dépôt appartient au compte de connexion, et c'est sa clé SSH
  # qui authentifie GitHub. Sans `force` non plus — une modification locale doit
  # arrêter le run, pas être écrasée en silence.
  #
  # Placée après les réglages système : si GitHub est injoignable, les correctifs de
  # boot ont déjà été appliqués.
  ansible.builtin.git:
    repo: "{{ immich_vm_repo_url }}"
    dest: "{{ immich_vm_repo_dir }}"
    version: "{{ immich_vm_repo_version }}"
    update: true
  notify: Appliquer la mise à jour du stack

- name: Activer et démarrer Immich au boot
  # Gardée hors --check : en dry-run l'unité n'a pas été écrite, et systemd répond
  # « Could not find the requested service ». La sauter est plus honnête qu'un
  # check_mode: false, qui lancerait réellement les conteneurs pendant un dry-run.
  ansible.builtin.systemd_service:
    name: immich.service
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode
