---
- name: Recharger les unités systemd
  # Nécessaire après /etc/fstab (systemd régénère les unités .mount depuis le
  # fstab-generator) comme après l'installation d'immich.service.
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Appliquer la mise à jour du stack
  # `systemctl start` ne ferait rien sur un service déjà actif : un compose modifié ne
  # serait jamais pris en compte. `up -d` recrée les seuls conteneurs qui ont changé,
  # là où un restart de l'unité arrêterait toute la pile Immich.
  # `--build` est indispensable : le service immich-custom est bâti depuis ce dépôt,
  # et son crontab comme son code vivent dans l'image. Sans lui, un correctif poussé
  # ne serait jamais appliqué — le conteneur repartirait sur l'ancienne image.
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: "{{ immich_vm_repo_dir }}"
  become: true
  changed_when: true

- name: Recharger la configuration système d'Immich
  # `up -d` ne recrée pas immich-server quand seul le CONTENU d'un fichier monté
  # change : sa définition dans le compose est identique. Or immich-system-config.yaml
  # n'est relu qu'au démarrage — sans ce redémarrage, un réglage poussé dans le dépôt
  # reste sans effet, et l'API refuse de le corriger tant qu'IMMICH_CONFIG_FILE est
  # actif. Redémarrage assumé à chaque mise à jour du dépôt : une trentaine de
  # secondes d'interruption, contre une configuration silencieusement périmée.
  ansible.builtin.command:
    cmd: docker compose restart immich-server
    chdir: "{{ immich_vm_repo_dir }}"
  become: true
  changed_when: true
