---
# Déploie un stack Caddy autonome sur le NAS Synology, en frontal TLS de :
#   - Immich  (photos.eonelia.fr → 127.0.0.1:2283)
#   - DSM     (nas.eonelia.fr    → 127.0.0.1:5001)
#
# ⚠ CONTRAINTE STRUCTURANTE — aucun module Python sur la cible.
# DSM 7.3.2 ne fournit que Python 3.7/3.8, alors qu'ansible-core ≥ 2.19 exige 3.9+
# sur l'hôte distant. Synology ne propose pas d'interpréteur plus récent. Ce rôle
# n'utilise donc QUE `ansible.builtin.raw` côté NAS ; tout ce qui demande Python
# (openssl, templates) est exécuté sur le CONTRÔLEUR via delegate_to: localhost,
# puis transféré par scp. Ne pas réintroduire copy/template/file/wait_for sur le
# NAS : le play échouerait avec « Ansible requires Python 3.9 or newer ».
#
# Transfert : scp -O (mode legacy). Le subsystem SFTP est désactivé sur ce NAS, donc
# un scp moderne échoue avec « subsystem request failed ». Le rsync livré par macOS
# est openrsync, qui gère mal -e → ansible.posix.synchronize n'est pas utilisable.
#
# Le docker-compose Immich existant n'est JAMAIS touché : Caddy tourne en
# network_mode:host et joint ses backends en loopback.
#
# ⚠ PIÈGE — `raw` est un module *free-form* : Ansible découpe sa valeur en arguments
# et exige des guillemets équilibrés. Une apostrophe française isolée à l'intérieur
# d'un bloc raw (y compris dans un commentaire shell, ex. « permet d'inspecter »)
# est lue comme une quote ouvrante jamais refermée et casse le play au chargement :
#   failed at splitting arguments, either an unbalanced jinja2 block or quotes
# → rédiger les commentaires INTERNES aux blocs raw sans aucune apostrophe.
#   Les commentaires YAML comme celui-ci ne sont pas concernés.

# --- Prérequis (raw) ----------------------------------------------------------
- name: Vérifier que Docker répond sur le NAS
  ansible.builtin.raw: "PATH={{ immich_proxy_path }} docker version >/dev/null && echo DOCKER_OK"
  register: immich_docker_check
  changed_when: false
  check_mode: false

- name: Détecter la commande compose disponible (plugin v2 ou binaire)
  ansible.builtin.raw: |
    export PATH={{ immich_proxy_path }}
    if docker compose version >/dev/null 2>&1; then
      echo "docker compose"
    elif command -v docker-compose >/dev/null 2>&1; then
      echo "docker-compose"
    else
      echo "none"
    fi
  register: immich_compose_probe
  changed_when: false
  check_mode: false

- name: Mémoriser la commande compose
  ansible.builtin.set_fact:
    immich_compose_cmd: "{{ immich_compose_probe.stdout_lines | map('trim') | select('match', '^docker') | first | default('none') }}"

- name: Échouer si aucune commande compose n'est disponible
  ansible.builtin.fail:
    msg: >-
      Ni « docker compose » ni « docker-compose » n'a été trouvé sur le NAS.
      Vérifie que le paquet Container Manager est installé et démarré.
  when: immich_compose_cmd == "none"

- name: Vérifier qu'Immich écoute sur {{ immich_proxy_backend }}
  ansible.builtin.raw: >-
    PATH={{ immich_proxy_path }}
    curl -fsS -o /dev/null --max-time 5 http://{{ immich_proxy_backend }}/api/server/ping
    && echo IMMICH_UP || echo IMMICH_DOWN
  register: immich_backend_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Avertir si le backend Immich ne répond pas
  ansible.builtin.debug:
    msg: >-
      ⚠ Immich ne répond pas sur {{ immich_proxy_backend }}. Le proxy sera déployé
      quand même mais renverra 502 tant que le stack Immich ne tourne pas, ou si son
      compose ne publie pas le port 2283 sur l'hôte.
  when: "'IMMICH_UP' not in immich_backend_probe.stdout | default('')"

# --- Build sur le CONTRÔLEUR --------------------------------------------------
# Le NAS n'a pas de Python exploitable : openssl et le rendu Jinja se font ici,
# et seuls des fichiers finis partent sur le NAS.
- name: Créer un dossier de build sur le contrôleur
  ansible.builtin.tempfile:
    state: directory
    suffix: immich_proxy
  delegate_to: localhost
  become: false
  register: immich_build
  changed_when: false

- name: Normaliser les .cer en PEM et assembler la fullchain (contrôleur)
  ansible.builtin.shell: |
    set -e
    b={{ immich_build.path | quote }}
    for pair in "leaf:{{ immich_att_leaf }}" "int1:{{ immich_att_int1 }}" "int2:{{ immich_att_int2 }}"; do
      n=${pair%%:*}; f=${pair#*:}
      openssl x509 -in "$f" -out "$b/$n.pem" 2>/dev/null \
        || openssl x509 -inform DER -in "$f" -out "$b/$n.pem"
    done
    cat "$b/leaf.pem" "$b/int1.pem" "$b/int2.pem" > "$b/fullchain.pem"
    cp {{ immich_att_key | quote }} "$b/privkey.key"
    chmod 600 "$b/privkey.key"
    openssl x509 -in "$b/leaf.pem" -noout -enddate
  delegate_to: localhost
  become: false
  register: immich_cert_build
  changed_when: false
  no_log: true

- name: Afficher l'expiration du wildcard
  ansible.builtin.debug:
    msg: "Certificat *.eonelia.fr — {{ immich_cert_build.stdout | default('non lisible') }}"

- name: Rendre le Caddyfile (contrôleur)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ immich_build.path }}/Caddyfile"
    mode: "0644"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Rendre le docker-compose du proxy (contrôleur)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ immich_build.path }}/docker-compose.yml"
    mode: "0644"
  delegate_to: localhost
  become: false
  changed_when: false

# --- Transfert ----------------------------------------------------------------
- name: Préparer le dossier de staging sur le NAS
  ansible.builtin.raw: "rm -rf {{ immich_proxy_staging }} && mkdir -p {{ immich_proxy_staging }} && chmod 700 {{ immich_proxy_staging }}"
  become: false
  changed_when: false

# scp -O : mode legacy imposé par l'absence de subsystem SFTP sur ce NAS.
# Le contenu passe par le canal SSH, jamais en argument de commande — la clé
# privée n'apparaît donc dans aucune ligne de commande côté NAS.
- name: Transférer les fichiers du stack vers le staging
  ansible.builtin.command:
    argv:
      - scp
      - "-O"
      - "-P"
      - "{{ ansible_port | default(22) }}"
      - "-o"
      - "BatchMode=yes"
      - "{{ immich_build.path }}/fullchain.pem"
      - "{{ immich_build.path }}/privkey.key"
      - "{{ immich_build.path }}/Caddyfile"
      - "{{ immich_build.path }}/docker-compose.yml"
      - "{{ ansible_user }}@{{ ansible_host }}:{{ immich_proxy_staging }}/"
  delegate_to: localhost
  become: false
  changed_when: false

# --- Installation (idempotente) -----------------------------------------------
- name: Installer les fichiers du stack si leur contenu a changé
  ansible.builtin.raw: |
    set -e
    d={{ immich_proxy_dir }}; s={{ immich_proxy_staging }}
    mkdir -p "$d/certs"
    # 755 sur la racine : le stack reste inspectable sans sudo (ni le Caddyfile ni le
    # compose ne contiennent de secret). Le durcissement porte sur certs/ (750
    # root:root) et surtout sur la clé privée, installée en 0600 plus bas.
    chmod 755 "$d"
    chmod 750 "$d/certs"
    changed=no
    for spec in "0644:fullchain.pem:certs/fullchain.pem" \
                "0600:privkey.key:certs/privkey.key" \
                "0644:Caddyfile:Caddyfile" \
                "0644:docker-compose.yml:docker-compose.yml"; do
      mode=$(echo "$spec" | cut -d: -f1)
      src=$(echo "$spec" | cut -d: -f2)
      dst=$(echo "$spec" | cut -d: -f3)
      if ! cmp -s "$s/$src" "$d/$dst"; then
        install -o root -g root -m "$mode" "$s/$src" "$d/$dst"
        changed=yes
      fi
    done
    echo "changed=$changed"
  register: immich_install
  changed_when: "'changed=yes' in immich_install.stdout"
  notify: Restart caddy

- name: Purger le staging du NAS
  ansible.builtin.raw: "rm -rf {{ immich_proxy_staging }}"
  become: false
  changed_when: false

- name: Purger le dossier de build du contrôleur
  ansible.builtin.file:
    path: "{{ immich_build.path }}"
    state: absent
  delegate_to: localhost
  become: false
  changed_when: false

# --- Validation puis démarrage ------------------------------------------------
# Valide AVANT de toucher au conteneur en service : un Caddyfile invalide ferait
# échouer le restart et couperait aussi l'accès DSM externe.
- name: Valider le Caddyfile avec l'image Caddy
  ansible.builtin.raw: >-
    PATH={{ immich_proxy_path }} docker run --rm
    -v {{ immich_proxy_dir }}/Caddyfile:/etc/caddy/Caddyfile:ro
    -v {{ immich_proxy_dir }}/certs:/certs:ro
    {{ immich_proxy_caddy_image }}
    caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
  changed_when: false

- name: Démarrer / mettre à jour le stack Caddy
  ansible.builtin.raw: "cd {{ immich_proxy_dir }} && PATH={{ immich_proxy_path }} {{ immich_compose_cmd }} up -d 2>&1"
  register: immich_compose_up
  changed_when: immich_compose_up.stdout is search('(Creating|Created|Recreate|Starting|Started|Pulling)')

- name: Vérifier que Caddy répond sur sa sonde de santé
  ansible.builtin.raw: "PATH={{ immich_proxy_path }} curl -fsS --max-time 5 --retry 6 --retry-delay 3 http://127.0.0.1:{{ immich_proxy_health_port }}/healthz"
  register: immich_health
  changed_when: false
