---
# Install + rattachement idempotent du client tailscale à Headscale.
# Mode kernel (interface tailscale0 réelle) → nécessite /dev/net/tun dans le CT
# (activé côté Proxmox par le play "tun" de main_headscale_playbook.yml).

- name: Prérequis (curl, gnupg)
  ansible.builtin.apt:
    name: [curl, gnupg, ca-certificates]
    state: present
    update_cache: true

- name: Ajouter la clé du dépôt Tailscale
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"

- name: Ajouter le dépôt Tailscale
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main"
    filename: tailscale
    state: present

- name: Installer tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Activer tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Vérifier la présence de /dev/net/tun (mode kernel)
  ansible.builtin.stat:
    path: /dev/net/tun
  register: tun_dev

- name: Échec explicite si tun absent
  ansible.builtin.fail:
    msg: >-
      /dev/net/tun absent dans le CT → tailscale ne peut pas créer tailscale0.
      Lancer d'abord le play "tun" (make headscale --limit proxmox_hosts) qui ajoute
      les lignes lxc.* au CT et le redémarre.
  when: not tun_dev.stat.exists

- name: État courant du client tailscale
  ansible.builtin.command: "tailscale status --json"
  register: ts_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Prefs courantes (pour détecter un changement de login-server)
  ansible.builtin.command: "tailscale debug prefs"
  register: ts_prefs
  changed_when: false
  failed_when: false
  check_mode: false

- name: Garde-fou — preauthkey requise si le client n'est pas déjà rattaché
  ansible.builtin.fail:
    msg: >-
      tailscale_authkey vide et {{ inventory_hostname }} non rattaché.
      La clé n'est héritée par hostvars que des plays de
      main_headscale_playbook.yml, qui ne couvre PAS tous les clients : caddy
      n'y figure pas, donc « make headscale » ne le rattachera jamais. Passer
      la clé explicitement, par exemple
      make caddy ARGS='--tags tailscale -e tailscale_authkey=<clé>'.
      Clé à CRÉER sur le CT headscale — le secret n'est affiché qu'à la
      création :
      headscale preauthkeys create -u 1 --reusable -e 87600h -o json
      Ne PAS reprendre une clé via « preauthkeys list » : son champ "key" y est
      abrégé (16 caractères après le préfixe au lieu de 77) et tailscale up
      échoue sur « failed to parse auth-key: key too short » — piège vérifié le
      2026-08-21. En v0.29 « list » n'accepte pas --user, et « create » attend
      l'ID numérique de l'utilisateur, pas son nom.
  when:
    - tailscale_authkey | length == 0
    - (ts_status.stdout | from_json).BackendState | default('NoState') != 'Running'

- name: Déduire le hostname du login-server (sans schéma ni port)
  ansible.builtin.set_fact:
    tailscale_login_host: "{{ tailscale_login_server | regex_replace('^https?://', '') | regex_replace('/.*$', '') | regex_replace(':[0-9]+$', '') }}"

# Un client sur le MÊME LAN que le CT headscale (chez la mère) ne peut pas le joindre
# via le WAN (mom.eonelia.fr → 82.67.182.91) : cela imposerait un hairpin NAT que la
# Freebox ne fait pas. Pour ceux-là on résout mom.eonelia.fr en LOCAL vers l'IP LAN du
# CT headscale (le cert wildcard *.eonelia.fr couvre le nom → TLS OK).
#
# Pour tous les AUTRES clients (caddy et optiplex-proxmox, chez Aurélien ; le Mac),
# cette entrée est un piège : l'IP du CT headscale appartient au LAN de la mère, or les
# deux sites utilisent le même plan 192.168.1.0/24. Elle a fait échouer le rattachement
# de caddy sur « No route to host » — constaté le 2026-08-21, tailscale up masqué par
# no_log. Ces clients passent par le DNS public + forward 34443 (port vérifié ouvert).
#
# D'où le state dynamique : l'entrée est RETIRÉE là où elle ne doit pas être, plutôt que
# la tâche simplement sautée — sinon une entrée déjà posée y survivrait indéfiniment.
- name: Résolution locale du login-server (seulement sur le LAN du CT headscale)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars['headscale'].ansible_host }} {{ tailscale_login_host }}"
    regexp: "\\s{{ tailscale_login_host | regex_escape }}$"
    state: "{{ 'present' if tailscale_login_via_lan | bool else 'absent' }}"

- name: Rattacher le client au tailnet (tailscale up)
  ansible.builtin.command: >-
    tailscale up
    --login-server {{ tailscale_login_server }}
    --authkey {{ tailscale_authkey }}
    --hostname {{ tailscale_hostname }}
    --timeout=60s
    {{ tailscale_up_args }}
  # (re)login si pas encore rattaché OU si le login-server a changé (ex. changement de port)
  when: >-
    ((ts_status.stdout | from_json).BackendState | default('NoState') != 'Running')
    or (tailscale_login_server not in (ts_prefs.stdout | default('')))
  register: ts_up
  changed_when: ts_up.rc == 0
  # no_log protège la clé, mais masquait AUSSI le message d'erreur : trois runs à
  # l'aveugle sur un « Module failed » sans texte, alors que tailscale disait
  # précisément « failed to parse auth-key: key too short » (2026-08-21). On
  # n'échoue donc plus ici ; la tâche suivante relaie la sortie, clé caviardée.
  failed_when: false
  no_log: true

- name: Échec explicite si le rattachement a échoué (sortie relayée, clé caviardée)
  vars:
    ts_out: "{{ ts_up.stderr | default('', true) or ts_up.stdout | default('', true) }}"
  ansible.builtin.fail:
    msg: >-
      tailscale up a échoué (rc={{ ts_up.rc }}) :
      {{ ts_out | replace(tailscale_authkey, '<authkey>')
         if tailscale_authkey | length > 0 else ts_out }}
  when:
    - not (ts_up.skipped | default(false))
    - (ts_up.rc | default(0)) != 0

- name: Afficher l'IP tailnet du client
  ansible.builtin.command: "tailscale ip -4"
  register: ts_ip
  changed_when: false
  check_mode: false

- name: IP tailnet
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} tailnet IP : {{ ts_ip.stdout }}"
