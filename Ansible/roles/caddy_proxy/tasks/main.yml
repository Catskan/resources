---
# Installe Caddy en paquet natif dans le CT et y déploie le Caddyfile généré.
#
# Paquet natif et non Docker : évite `nesting=1` sur un CT non privilégié, une couche
# d'images, et un healthcheck de contournement. Caddy est un binaire unique avec une
# unité systemd — le conteneur n'a rien d'autre à faire tourner.
#
# ⚠️ Le Caddyfile est VALIDÉ avant rechargement. Un fichier invalide déployé sur la
# porte d'entrée publique la casserait, et le rollback exigerait un accès au CT.

- name: Dépendances du dépôt Caddy
  ansible.builtin.apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
    state: present
    update_cache: true

# gnupg et le répertoire des keyrings sont des PRÉ-REQUIS de la tâche « Dépôt Caddy »
# ci-dessous, et ils portent `check_mode: false` à dessein.
#
# En `--check`, la tâche apt qui précède ne pose rien réellement : le binaire `gpg`
# n'existe donc pas quand `apt_repository` (avec `signed-by=`) en a besoin pour traiter
# la clé, et le dry-run échoue sur un CT vierge — alors que le run réel fonctionne.
#
# On force donc ces deux effets de bord, minimes et idempotents, pendant le dry-run, pour
# que le reste de la simulation ait un sens. Même parti pris que roles/headscale, dont le
# `get_url` du .deb porte la même garde pour la même raison.
#
# L'alternative — poser `not ansible_check_mode` sur « Dépôt Caddy » — a été ÉCARTÉE :
# elle ferait passer le dry-run en le rendant aveugle, on perdrait le `--diff` sur l'ajout
# du dépôt, qui est précisément ce qu'un dry-run doit montrer.
- name: gnupg présent, même en dry-run
  ansible.builtin.apt:
    name: gnupg
    state: present
  check_mode: false

- name: Répertoire des keyrings apt présent, même en dry-run
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  check_mode: false

- name: Clé du dépôt Caddy
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable.asc
    mode: "0644"

- name: Dépôt Caddy
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/caddy-stable.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    filename: caddy-stable
    state: present

- name: Paquet Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Déposer le Caddyfile pour validation
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile.new
    owner: root
    group: root
    mode: "0644"
  register: caddy_file_new

- name: Valider le Caddyfile avant de l'activer
  ansible.builtin.command: caddy validate --config /etc/caddy/Caddyfile.new
  when: caddy_file_new.changed
  changed_when: false

- name: Activer le Caddyfile validé
  ansible.builtin.copy:
    src: /etc/caddy/Caddyfile.new
    dest: /etc/caddy/Caddyfile
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  when: caddy_file_new.changed
  notify: Recharger Caddy

- name: Service Caddy actif au démarrage
  ansible.builtin.systemd_service:
    name: caddy
    enabled: true
    state: started
  when: not ansible_check_mode
