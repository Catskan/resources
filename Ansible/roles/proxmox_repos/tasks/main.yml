---
# Configure les dépôts APT Proxmox :
#   - désactive tous les dépôts enterprise (401 sans abonnement)
#   - active le dépôt no-subscription (communauté, gratuit)
#
# Gère les deux formats : .list (legacy) et .sources (DEB822, Proxmox 9+).

- name: Désactiver les dépôts enterprise Proxmox (.sources + .list)
  ansible.builtin.shell: |
    set -e
    changed=0
    # Format DEB822 (.sources) — ajouter "Enabled: no" après la ligne Types:
    for f in /etc/apt/sources.list.d/*.sources; do
      [ -f "$f" ] || continue
      grep -q 'enterprise\.proxmox\.com' "$f" || continue
      grep -q '^Enabled: no' "$f" && continue
      sed -i '/^Types:/a Enabled: no' "$f"
      changed=1
    done
    # Format legacy (.list) — commenter les lignes deb
    for f in /etc/apt/sources.list.d/*.list; do
      [ -f "$f" ] || continue
      grep -q 'enterprise\.proxmox\.com' "$f" || continue
      sed -i 's|^deb https://enterprise\.proxmox\.com|# deb https://enterprise.proxmox.com|g' "$f"
      changed=1
    done
    echo "changed=$changed"
  register: proxmox_repos_disable_enterprise
  changed_when: "'changed=1' in proxmox_repos_disable_enterprise.stdout"

- name: Activer le dépôt no-subscription (pve-no-subscription)
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription"
    filename: pve-no-subscription
    state: present
    update_cache: false

- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
