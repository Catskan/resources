---
- name: Recharger sshd
  become: true
  ansible.builtin.command: launchctl kickstart -k system/com.openssh.sshd
  changed_when: true
  when: ansible_os_family == "Darwin"

# Rebind du socket launchd : SEUL moyen d'appliquer un changement de port
# (/etc/services). unload puis load -w. ⚠️ Coupe la session SSH en cours.
- name: Rebinder le socket ssh launchd
  become: true
  ansible.builtin.shell: |
    launchctl unload /System/Library/LaunchDaemons/ssh.plist
    launchctl load -w /System/Library/LaunchDaemons/ssh.plist
  changed_when: true
  when: ansible_os_family == "Darwin"

# Pendant Linux du handler « Recharger sshd » ci-dessus. `ssh.socket` n'accepte
# pas `reloaded` → restart ; `ssh.service` accepte reload, moins brutal.
# Un restart de sshd ne coupe PAS les sessions déjà établies (chacune vit dans
# son propre processus), mais il faut malgré tout valider une NOUVELLE connexion
# avant de fermer la session courante.
- name: Recharger sshd (Linux)
  become: true
  ansible.builtin.systemd_service:
    name: "{{ sshd_hardening_reload_unit }}"
    state: "{{ 'restarted' if sshd_hardening_reload_unit == 'ssh.socket' else 'reloaded' }}"
  when: ansible_os_family != "Darwin"
