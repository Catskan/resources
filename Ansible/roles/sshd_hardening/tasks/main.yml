---
- name: Vérifier qu'AllowUsers inclut l'utilisateur de connexion (anti-lockout)
  ansible.builtin.assert:
    that:
      - sshd_allowed_users | length > 0
      - ansible_user in sshd_allowed_users
    fail_msg: >-
      sshd_allowed_users ({{ sshd_allowed_users }}) doit inclure ansible_user
      ({{ ansible_user }}), sinon la connexion SSH gérée se verrouille.
  when: (ansible_connection | default('ssh')) != 'local'

- name: Régler le port SSH via /etc/services (macOS — launchd bind sshd sur le service `ssh`)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/services
    regexp: "^ssh\\s+[0-9]+/{{ item }}\\b"
    line: "ssh              {{ sshd_port }}/{{ item }}"
    backup: true
  loop:
    - tcp
    - udp
  when:
    - sshd_port is defined
    - ansible_os_family == "Darwin"
  # ⚠️ Le rebind du socket (handler ci-dessous) COUPE la session SSH en cours sur
  #    un changement RÉEL de port. Idempotent (no-op) si /etc/services est déjà bon.
  notify: Rebinder le socket ssh launchd

# --- Branche Linux (Debian/Proxmox) -------------------------------------------
# Ce rôle a d'abord été écrit pour macOS : ses handlers étaient TOUS gardés sur
# Darwin, donc sur Linux le drop-in était déposé, le notify déclenché, et le
# handler skippé — sshd n'était jamais rechargé et le run restait vert sur un
# hôte non durci. Les trois tâches ci-dessous ferment ce trou.

- name: Vérifier que sshd lit le répertoire drop-in (Linux)
  become: true
  ansible.builtin.command: grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/\*\.conf' /etc/ssh/sshd_config
  register: sshd_hardening_include_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_os_family != "Darwin"

- name: Échouer si l'Include du drop-in est absent (le durcissement serait décoratif)
  ansible.builtin.assert:
    that:
      - sshd_hardening_include_check.rc == 0
    fail_msg: >-
      /etc/ssh/sshd_config ne contient pas « Include /etc/ssh/sshd_config.d/*.conf ».
      Le fichier déposé par ce rôle ne serait jamais lu, et le run serait vert pour
      rien. Ajouter la ligne en TÊTE du fichier (sshd retient la PREMIÈRE occurrence
      de chaque directive), puis relancer.
    success_msg: Le drop-in sshd_config.d est bien inclus.
  when: ansible_os_family != "Darwin"

- name: Déterminer l'unité systemd à recharger (Debian 13/PVE 9 active ssh.socket)
  become: true
  ansible.builtin.command: systemctl is-enabled ssh.socket
  register: sshd_hardening_socket_state
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_os_family != "Darwin"

- name: Retenir l'unité à recharger
  ansible.builtin.set_fact:
    sshd_hardening_reload_unit: >-
      {{ 'ssh.socket' if sshd_hardening_socket_state.stdout | trim == 'enabled' else 'ssh.service' }}
  when: ansible_os_family != "Darwin"

- name: Déposer le drop-in de durcissement SSH
  become: true
  ansible.builtin.template:
    src: 010-runon-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/010-runon-hardening.conf
    owner: root
    group: "{{ 'wheel' if ansible_os_family == 'Darwin' else 'root' }}"
    mode: "0644"
    validate: /usr/sbin/sshd -G -f %s
  # Les deux handlers portent des gardes d'OS mutuellement exclusives : un seul
  # s'exécutera, selon la plateforme.
  notify:
    - Recharger sshd
    - Recharger sshd (Linux)

- name: Parser la configuration sshd effective (chemin absolu = évite un sshd Homebrew)
  become: true
  ansible.builtin.command: /usr/sbin/sshd -G
  changed_when: false
  check_mode: false
  register: sshd_effective

- name: Contrôler les valeurs de durcissement effectives
  ansible.builtin.assert:
    that:
      - "('passwordauthentication ' ~ sshd_password_authentication) in sshd_effective.stdout"
      - "('permitrootlogin ' ~ sshd_permit_root_login) in sshd_effective.stdout"
      - "('kbdinteractiveauthentication ' ~ sshd_kbdinteractive_authentication) in sshd_effective.stdout"
    success_msg: Durcissement SSH effectif confirmé.
  when: not ansible_check_mode
