---
# Provisionne le CT claude-code EN DIRECT (SSH via ProxyJump), pas via pct exec.
# Prépare l'hôte à recevoir la migration des données + le déploiement du compose.
# Le `docker compose up` final attend la migration des données (cf. MIGRATION-WYSE.md).

- name: Installer les prérequis apt
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - rsync
      - sqlite3
    update_cache: true
    state: present

- name: Créer le répertoire des keyrings apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

# `checksum` n'est pas décoratif, il rend la tâche IDEMPOTENTE. Sans lui, get_url
# arbitre sur les dates : il compare le `Last-Modified` du serveur au mtime du
# fichier local. Docker a republié cette clé le 2026-08-06 avec un contenu
# INCHANGÉ (son etag est le md5 du corps, identique de part et d'autre), donc
# l'amont paraît éternellement plus récent que notre fichier — et la tâche se
# déclarait « changed » à chaque convergence, sans rien modifier. Un `changed`
# permanent est pire qu'inutile : il détruit la valeur de `changed=0` comme
# signal, celui-là même qui sert à valider les autres convergences.
#
# Ancrer sur le CONTENU corrige ça et resserre la confiance au passage : le
# fichier n'est retéléchargé que s'il ne correspond plus à l'empreinte, et rien
# qui diffère de l'empreinte n'est installé — c'est une ancre de confiance APT,
# pas un fichier quelconque.
#
# ⚠️ Si Docker fait TOURNER sa clé pour de vrai, cette tâche gardera l'ancienne et
#    apt échouera sur la vérification de signature. C'est le comportement voulu :
#    un échec bruyant à investiguer, plutôt qu'une nouvelle clé acceptée en
#    silence. Mettre alors l'empreinte à jour délibérément.
#    Relevée le 2026-08-24, identique en local et à l'amont.
- name: Récupérer la clé GPG Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    checksum: sha256:1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
    mode: "0644"

- name: Ajouter le dépôt Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Installer Docker CE + plugin compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    update_cache: true
    state: present

- name: Docker démarré et activé au boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Créer l'arborescence /volume1/Aurelien (mêmes chemins que le NAS → zéro remap)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /volume1/Aurelien/AI/Claude-data
    - /volume1/Aurelien/AI/Claude
    - /volume1/Aurelien/Projects

- name: Vérifier que Docker répond
  ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
  register: docker_version
  changed_when: false

- name: Version de Docker installée
  ansible.builtin.debug:
    msg: "Docker Server {{ docker_version.stdout }} opérationnel dans le CT."

- name: Maintenance disque du CT (Docker/journald/apt)
  ansible.builtin.import_tasks: maintenance.yml
  tags: maintenance

- name: Sauvegarde du backend Claude vers le NAS
  ansible.builtin.import_tasks: backup.yml
  tags: backup
