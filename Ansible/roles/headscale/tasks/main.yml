---
# Install + configuration idempotente de Headscale dans le CT dédié, TLS natif via
# wildcard *.eonelia.fr (KeePass), + updater DynDNS IONOS. Génère aussi une preauthkey
# réutilisable exposée aux autres plays (hostvars) pour rattacher les clients.

- name: Prérequis (curl, ca-certificates)
  ansible.builtin.apt:
    name: [curl, ca-certificates]
    state: present
    update_cache: true

- name: Récupérer la version headscale installée (si présente)
  ansible.builtin.command: "headscale version"
  register: hs_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Installer Headscale {{ headscale_version }} (download + apt, atomique)
  when: headscale_version not in (hs_installed.stdout | default(''))
  block:
    - name: Télécharger le paquet .deb
      ansible.builtin.get_url:
        url: "{{ headscale_deb_url }}"
        dest: "/tmp/headscale_{{ headscale_version }}.deb"
        mode: "0644"
      # Doit exister même en --check pour que l'install ci-dessous puisse s'évaluer
      # (sinon apt échoue « Could not open file » en dry-run).
      check_mode: false

    - name: Installer le .deb
      ansible.builtin.apt:
        deb: "/tmp/headscale_{{ headscale_version }}.deb"
      notify: Restart headscale

# --- TLS wildcard *.eonelia.fr (attachments KeePass, via host_vars/headscale/secrets.yml) ---
# Mode certfile UNIQUEMENT (headscale_tls_mode, defaults/main.yml) — le repli en cas de
# problème ACME. Ne rien supprimer ici : c'est le chemin de retour arrière.
# viczem.keepass écrit chaque attachment dans un fichier temp (contrôleur) et retourne son
# CHEMIN → on copie ces fichiers sur le CT, on normalise en PEM (.cer = PEM ou DER selon la CA),
# et on assemble la fullchain feuille+int1+int2. Restart headscale seulement si le contenu change.
- name: TLS wildcard commercial (mode certfile)
  when: headscale_tls_mode == "certfile"
  block:
    - name: Créer les dossiers de certificats
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: headscale
        group: headscale
        mode: "0750"
      loop:
        - "{{ headscale_tls_cert_path | dirname }}"
        - "{{ headscale_tls_cert_path | dirname }}/src"

    - name: Copier les 4 fichiers du wildcard vers le CT
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ headscale_tls_cert_path | dirname }}/src/{{ item.name }}"
        owner: headscale
        group: headscale
        mode: "0640"
      loop:
        - { src: "{{ hs_att_leaf }}", name: leaf.cer }
        - { src: "{{ hs_att_int1 }}", name: int1.cer }
        - { src: "{{ hs_att_int2 }}", name: int2.cer }
        - { src: "{{ hs_att_key }}", name: privkey.key }
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Normaliser en PEM + assembler la fullchain (feuille + int1 + int2)
      ansible.builtin.shell: |
        set -e
        d="{{ headscale_tls_cert_path | dirname }}"; s="$d/src"
        for f in leaf int1 int2; do
          openssl x509 -in "$s/$f.cer" -out "$s/$f.pem" 2>/dev/null \
            || openssl x509 -inform DER -in "$s/$f.cer" -out "$s/$f.pem"
        done
        cat "$s/leaf.pem" "$s/int1.pem" "$s/int2.pem" > "$s/fullchain.pem"
        changed=no
        if ! cmp -s "$s/fullchain.pem" "{{ headscale_tls_cert_path }}" 2>/dev/null; then
          install -o headscale -g headscale -m 0644 "$s/fullchain.pem" "{{ headscale_tls_cert_path }}"; changed=yes
        fi
        if ! cmp -s "$s/privkey.key" "{{ headscale_tls_key_path }}" 2>/dev/null; then
          install -o headscale -g headscale -m 0640 "$s/privkey.key" "{{ headscale_tls_key_path }}"; changed=yes
        fi
        rm -rf "$s"
        echo "changed=$changed"
      register: hs_tls_assemble
      changed_when: "'changed=yes' in hs_tls_assemble.stdout"
      no_log: true
      notify: Restart headscale

# --- TLS Let's Encrypt natif (mode acme, headscale v0.29.2) ---------------------
# TLS-ALPN-01 plutôt que HTTP-01 : le challenge est répondu directement sur le listener
# TLS déjà ouvert par headscale (headscale_listen_addr) — pas de port 80 à exposer sur un
# réseau tiers, pas de service supplémentaire (contrairement à HTTP-01, qui a besoin d'un
# listener :http dédié via tls_letsencrypt_listen).
#
# Prérequis RÉSEAU (à poser À LA MAIN chez la mère, hors Ansible — jamais exécuté par ce rôle) :
#   1. Let's Encrypt se connecte à mom.eonelia.fr:443 (port 443 fixe côté protocole ACME,
#      non négociable) → il faut une redirection WAN:443 → CT:34443 sur la Freebox de la mère.
#      La redirection existante du 34443 (cf. README) ne suffit pas : elle ne couvre que le
#      trafic tailnet normal, pas la validation ACME qui arrive sur 443.
#      ⚠️ Le rôle proxmox_headscale_lxc et ce rôle documentent déjà que « la Freebox mère
#      interdit les redirections sur port < 32768 » pour le port WAN choisi côté 34443 —
#      vérifier concrètement, avant de basculer en acme, que l'interface de la Freebox
#      accepte bien une règle avec 443 en port WAN (443 est par ailleurs réservé à Freebox
#      OS sur certains modèles). Si ce n'est pas possible, le mode acme est bloqué par le
#      matériel réseau, indépendamment de ce rôle.
#   2. inventory/host_vars/headscale/connection.yml : ansible_host du CT (192.168.1.168) est
#      une IP DHCP — la note « réservation DHCP à poser » y est déjà présente. TANT QUE cette
#      réservation n'est pas posée, ne PAS router le port-forward 443 vers cette IP : le bail
#      DHCP peut changer, la redirection pointerait alors dans le vide, le RENOUVELLEMENT
#      Let's Encrypt échouerait en silence (pas d'alerte immédiate — headscale continue de
#      servir l'ancien certificat jusqu'à son expiration), et la panne TLS n'apparaîtrait que
#      ~60 jours plus tard, sans lien apparent avec sa cause réelle. La réservation DHCP est
#      un PRÉREQUIS du mode acme, pas un confort.
- name: TLS Let's Encrypt natif (mode acme)
  when: headscale_tls_mode == "acme"
  block:
    - name: Vérifier que acme_email et le hostname Let's Encrypt sont renseignés
      ansible.builtin.assert:
        that:
          - headscale_acme_email | length > 0
          - headscale_tls_letsencrypt_hostname | length > 0
        fail_msg: >-
          headscale_tls_mode=acme nécessite headscale_acme_email et
          headscale_tls_letsencrypt_hostname non vides (defaults/main.yml ou host_vars).

    - name: Créer le cache Let's Encrypt (StateDirectory=headscale, cf. unit systemd)
      ansible.builtin.file:
        path: "{{ headscale_tls_letsencrypt_cache_dir }}"
        state: directory
        owner: headscale
        group: headscale
        mode: "0750"

# --- Configuration --------------------------------------------------------------
- name: Templater /etc/headscale/config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/headscale/config.yaml
    owner: headscale
    group: headscale
    mode: "0644"
  notify: Restart headscale

# --- Post-install : service + utilisateur + preauthkey --------------------------
# Ces étapes opèrent sur le paquet headscale RÉELLEMENT installé (service systemd,
# CLI `headscale`) → sautées en --check : en dry-run le .deb n'est pas posé, donc
# ni le service ni la CLI n'existent (sinon « Could not find service headscale »).
- name: Service + utilisateur + preauthkey (hors --check)
  when: not ansible_check_mode
  block:
    - name: Activer et démarrer headscale
      ansible.builtin.systemd:
        name: headscale
        enabled: true
        state: started

    - name: Appliquer les handlers en attente (restart) avant les commandes CLI
      ansible.builtin.meta: flush_handlers

    - name: Lister les utilisateurs headscale
      ansible.builtin.command: "headscale users list --output json"
      register: hs_users
      changed_when: false

    - name: Créer l'utilisateur {{ headscale_user }} si absent
      ansible.builtin.command: "headscale users create {{ headscale_user }}"
      when: (hs_users.stdout | from_json | selectattr('name', 'equalto', headscale_user) | list | length) == 0
      changed_when: true

    - name: Re-lister les utilisateurs (récupérer l'ID, y compris le nouveau)
      ansible.builtin.command: "headscale users list --output json"
      register: hs_users2
      changed_when: false

    - name: Déterminer l'ID numérique de {{ headscale_user }}
      ansible.builtin.set_fact:
        hs_user_id: "{{ hs_users2.stdout | from_json | selectattr('name', 'equalto', headscale_user) | map(attribute='id') | first }}"

    - name: Générer une preauthkey réutilisable
      # headscale 0.29 : --user attend l'ID numérique, plus le nom.
      ansible.builtin.command: >-
        headscale preauthkeys create --user {{ hs_user_id }}
        --reusable --expiration {{ headscale_preauthkey_expiration }} --output json
      register: hs_pak
      changed_when: true

    - name: Exposer la preauthkey aux autres plays (hostvars['headscale'].hs_preauthkey)
      ansible.builtin.set_fact:
        hs_preauthkey: "{{ (hs_pak.stdout | from_json).key }}"
      no_log: true
