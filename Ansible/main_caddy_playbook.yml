---
# Reverse-proxy public de la maison, dans un CT dédié de l'Optiplex.
#
# Deux plays : le premier crée le CT depuis l'hôte Proxmox, le second configure ce
# CT comme hôte Ansible à part entière via le rôle caddy_proxy (installation de
# Caddy, Caddyfile, certificats ACME).
#
# make caddy         → les deux plays
# make check-caddy   → dry-run (--check --diff)

- name: Création du CT Caddy sur l'hôte Proxmox
  hosts: proxmox_optiplex
  gather_facts: true
  roles:
    # `caddy_ct_tailscale` décrit le CT et vit donc dans host_vars/caddy. Mais le
    # montage de /dev/net/tun qu'il pilote s'exécute ICI, sur l'hôte Proxmox, qui
    # ne voit pas les variables du CT : sans cette indirection la tâche est
    # silencieusement SAUTÉE, et le rôle tailscale_client du play suivant échoue
    # sur « /dev/net/tun absent » — constaté le 2026-08-20, le drapeau étant à true
    # côté CT et non défini côté hôte.
    - role: proxmox_caddy_lxc
      caddy_ct_tailscale: "{{ hostvars['caddy'].caddy_ct_tailscale | default(false) }}"
      tags: [ct]

- name: Configuration du reverse-proxy Caddy
  hosts: caddy_hosts
  gather_facts: true
  roles:
    - role: caddy_proxy
      tags: [proxy]

    # Rattachement au tailnet, pour que les vhosts privés soient joignables depuis
    # l'extérieur du LAN. Conditionné au même drapeau que le montage de /dev/net/tun
    # côté hôte : sans le périphérique, ce rôle échoue volontairement plutôt que de
    # basculer en userspace-networking.
    #
    # Placé APRÈS caddy_proxy à dessein : si le rattachement échoue (Headscale
    # injoignable, preauthkey expirée), le reverse-proxy est déjà configuré et sert
    # ses vhosts publics. L'inverse laisserait le proxy non déployé pour une panne
    # qui ne le concerne pas.
    #
    # La preauthkey vient du play headscale (`make headscale`) via hostvars ; en run
    # isolé, la passer en ligne de commande :
    #   make caddy ARGS='--tags tailscale -e tailscale_authkey=<clé>'
    - role: tailscale_client
      when: caddy_ct_tailscale | bool
      tags: [tailscale]
